        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        contact_count: { type: integer, format: int64 }

    TagInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        color: { type: string, pattern: "^[a-z]{3,12}$" }

    Group:
      type: object
      required: [id, name, description, member_count, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        member_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    GroupInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }

    GroupMembersRequest:
      type: object
      additionalProperties: false
      required: [action, contact_ids]
      properties:
        action: { type: string, enum: [add, remove] }
        contact_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, format: uuid }

    Count:
      type: object
      required: [count]
      properties:
        count: { type: integer, format: int64 }

    SegmentDefinition:
      type: object
      description: >-
        A group {"op":"and"|"or","not"?:bool,"rules":[...]} or a rule
        {"field":..., "operator":..., "value":...}. Fields: name, profile_name,
        phone, email, var1–var5, created_at, last_inbound_at, opted_out, tag, group.
      additionalProperties: true

    Segment:
      type: object
      required: [id, name, description, definition, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        definition: { $ref: "#/components/schemas/SegmentDefinition" }
        contact_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SegmentInput:
      type: object
      additionalProperties: false
      required: [name, definition]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        definition: { $ref: "#/components/schemas/SegmentDefinition" }

    UpdateSegmentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        definition: { $ref: "#/components/schemas/SegmentDefinition" }

    SegmentPreview:
      type: object
      required: [count, sample]
      properties:
        count: { type: integer, format: int64 }
        sample:
          type: array
          items: { $ref: "#/components/schemas/Contact" }

    ContactImport:
      type: object
      required: [id, filename, status, headers, preview, mapping, duplicate_policy, add_tags, total_rows, processed_rows,
                 created_count, updated_count, skipped_count, failed_count, has_error_report, created_at]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        status: { type: string, enum: [uploaded, queued, running, completed, failed, cancelled] }
        headers:
          type: array
          items: { type: string }
        preview:
          type: array
          items:
            type: array
            items: { type: string }
        mapping:
          type: object
          additionalProperties: { type: string }
        duplicate_policy: { type: string, enum: [skip, update] }
        add_tags:
          type: array
          items: { type: string }
        group_id: { type: [string, "null"], format: uuid }
        total_rows: { type: integer, format: int64 }
        processed_rows: { type: integer, format: int64 }
        created_count: { type: integer, format: int64 }
        updated_count: { type: integer, format: int64 }
        skipped_count: { type: integer, format: int64 }
        failed_count: { type: integer, format: int64 }
        has_error_report: { type: boolean }
        last_error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    StartContactImportRequest:
      type: object
      additionalProperties: false
      required: [mapping]
      properties:
        mapping:
          type: object
          description: Contact field → column header. "phone" is required; other keys are name, email, var1–var5, tags, or "attr:<name>".
          minProperties: 1
          maxProperties: 60
          additionalProperties: { type: string, minLength: 1, maxLength: 200 }
        duplicate_policy: { type: string, enum: [skip, update], default: skip }
        add_tags:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 60 }
        group_id: { type: string, format: uuid }

    ContactResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/Contact" }, meta: { $ref: "#/components/schemas/Meta" } }
    ContactListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Contact" } }
        meta: { $ref: "#/components/schemas/Meta" }
    NoteResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/Note" }, meta: { $ref: "#/components/schemas/Meta" } }
    NoteListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Note" } }
        meta: { $ref: "#/components/schemas/Meta" }
    TagResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/Tag" }, meta: { $ref: "#/components/schemas/Meta" } }
    TagListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        meta: { $ref: "#/components/schemas/Meta" }
    GroupResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/Group" }, meta: { $ref: "#/components/schemas/Meta" } }
    GroupListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Group" } }
        meta: { $ref: "#/components/schemas/Meta" }
    CountResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/Count" }, meta: { $ref: "#/components/schemas/Meta" } }
    SegmentResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/Segment" }, meta: { $ref: "#/components/schemas/Meta" } }
    SegmentListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Segment" } }
        meta: { $ref: "#/components/schemas/Meta" }
    SegmentPreviewResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/SegmentPreview" }, meta: { $ref: "#/components/schemas/Meta" } }
    ContactImportResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/ContactImport" }, meta: { $ref: "#/components/schemas/Meta" } }
    ContactImportListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ContactImport" } }
        meta: { $ref: "#/components/schemas/Meta" }

    # ── Inbox (Phase 7) ─────────────────────────────────────────────────────
    ConversationContact:
      type: object
      required: [id, phone, name, profile_name, opted_out]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        name: { type: string }
        profile_name: { type: string }
        opted_out: { type: boolean }
    ConversationPhoneNumber:
      type: object
      required: [id, display_phone_number, verified_name]
      properties:
        id: { type: string, format: uuid }
        display_phone_number: { type: string }
        verified_name: { type: string }
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ConversationLastMessage:
      type: object
      required: [direction, type, body, status]
      properties:
        direction: { type: string, enum: [inbound, outbound] }
        type: { type: string }
        body: { type: string }
        status: { type: string }
    Conversation:
      type: object
      required: [id, contact, phone_number, status, assignee, unread_count, last_message_at, last_inbound_at,
                 window_open, window_expires_at, last_message, closed_at, created_at]
      properties:
        id: { type: string, format: uuid }
        contact: { $ref: "#/components/schemas/ConversationContact" }
        phone_number: { $ref: "#/components/schemas/ConversationPhoneNumber" }
        status: { type: string, enum: [open, closed] }
        assignee:
          oneOf:
            - { $ref: "#/components/schemas/UserRef" }
            - { type: "null" }
        unread_count: { type: integer, format: int32 }
        last_message_at: { type: string, format: date-time }
        last_inbound_at: { type: [string, "null"], format: date-time, description: Last customer message that opened the 24-hour window. }
        window_open: { type: boolean, description: Free-form messages can be sent now. }
        window_expires_at: { type: [string, "null"], format: date-time }
        last_message:
          oneOf:
            - { $ref: "#/components/schemas/ConversationLastMessage" }
            - { type: "null" }
        closed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    ConversationResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/Conversation" }, meta: { $ref: "#/components/schemas/Meta" } }
    ConversationListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Conversation" } }
        meta: { $ref: "#/components/schemas/Meta" }
    InboxMedia:
      type: object
      required: [id, mime_type, filename, size_bytes, status]
      properties:
        id: { type: string, format: uuid }
        mime_type: { type: string }
        filename: { type: string }
        size_bytes: { type: [integer, "null"], format: int64 }
        status: { type: string, enum: [pending, stored, failed] }
    InboxMessage:
      type: object
      required: [id, direction, type, body, status, wamid, reply_to_wamid, source, error_code, error_title, media,
                 occurred_at, sent_at, delivered_at, read_at, failed_at, created_at]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        type: { type: string }
        body: { type: string }
        status: { type: string, enum: [pending, sending, unknown, sent, delivered, read, failed, received] }
        wamid: { type: [string, "null"] }
        reply_to_wamid: { type: [string, "null"] }
        source: { type: string, enum: [api, panel, webhook, campaign, automation] }
        error_code: { type: [string, "null"] }
        error_title: { type: [string, "null"] }
        media:
          oneOf:
            - { $ref: "#/components/schemas/InboxMedia" }
            - { type: "null" }
        occurred_at: { type: string, format: date-time }
        sent_at: { type: [string, "null"], format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        read_at: { type: [string, "null"], format: date-time }
        failed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    InboxMessageResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/InboxMessage" }, meta: { $ref: "#/components/schemas/Meta" } }
    InboxMessageListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/InboxMessage" } }
        meta: { $ref: "#/components/schemas/Meta" }
    ReplyRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [text, template, image, video, audio, document] }
        reply_to: { type: string, maxLength: 200, description: WhatsApp message ID to quote. }
        text:
          type: object
          additionalProperties: false
          required: [body]
          properties:
            body: { type: string, minLength: 1, maxLength: 4096 }
            preview_url: { type: boolean }
        template:
          type: object
          additionalProperties: false
          required: [name, language]
          properties:
            name: { type: string, maxLength: 512 }
            language: { type: string, maxLength: 15 }
            components:
              type: array
              maxItems: 20
              items: { type: object, additionalProperties: true }
        media: { $ref: "#/components/schemas/MediaRef" }
    AssignConversationRequest:
      type: object
      additionalProperties: false
      required: [assignee_id]
      properties:
        assignee_id: { type: [string, "null"], format: uuid, description: The user to assign; null unassigns. }
    ConversationEvent:
      type: object
      required: [id, kind, actor_type, actor_name, assignee, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [assigned, unassigned, closed, reopened] }
        actor_type: { type: string, enum: [user, api_key, system] }
        actor_name: { type: [string, "null"], description: "The user who acted; null for API keys and automatic reopening." }
        assignee:
          oneOf:
            - { $ref: "#/components/schemas/UserRef" }
            - { type: "null" }
        created_at: { type: string, format: date-time }
    ConversationEventListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ConversationEvent" } }
        meta: { $ref: "#/components/schemas/Meta" }

    # ── Realtime (Phase 6) ──────────────────────────────────────────────────
    RealtimeSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [channel]
      properties:
        channel: { type: string, minLength: 3, maxLength: 128, description: "Channel name, e.g. inbox:all or campaign:<id>." }
    RealtimeToken:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string, description: Centrifugo JWT. }
        expires_at: { type: string, format: date-time }
    RealtimeTokenResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/RealtimeToken" }, meta: { $ref: "#/components/schemas/Meta" } }

    # ── Campaigns (Phase 5) ────────────────────────────────────────────────
    CampaignStatus:
      type: string
      enum: [draft, scheduled, preparing, running, paused, completed, cancelled, failed]

    CampaignAudience:
      type: object
      additionalProperties: false
      description: Exactly one of the properties.
      minProperties: 1
      maxProperties: 1
      properties:
        segment_id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        tag_id: { type: string, format: uuid }
        all: { type: boolean, enum: [true] }

    CampaignParams:
      type: object
      additionalProperties: false
      description: >-
        Template variables. Values may contain {{name}}, {{first_name}}, {{phone}},
        {{email}}, {{var1}}–{{var5}} and {{attr:<key>}}. Use a list for positional
        templates and an object for named parameters.
      properties:
        header:
          oneOf:
            - { type: array, maxItems: 10, items: { type: string, maxLength: 1024 } }
            - { type: object, maxProperties: 10, additionalProperties: { type: string, maxLength: 1024 } }
        body:
          oneOf:
            - { type: array, maxItems: 20, items: { type: string, maxLength: 1024 } }
            - { type: object, maxProperties: 20, additionalProperties: { type: string, maxLength: 1024 } }
        buttons:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 2000 }
        fallback:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 1024 }

    Campaign:
      type: object
      required: [id, name, status, phone_number_id, template_name, template_language, template_params, audience,
                 window_size, total_recipients, counts, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: "#/components/schemas/CampaignStatus" }
        phone_number_id: { type: string, format: uuid }
        template_name: { type: string }
        template_language: { type: string }
        template_params: { $ref: "#/components/schemas/CampaignParams" }
        audience: { $ref: "#/components/schemas/CampaignAudience" }
        window_size: { type: integer, description: Messages in flight at once; 0 means automatic. }
        total_recipients: { type: integer, format: int64 }
        counts:
          type: object
          description: Recipients by state (recipients_pending, recipients_skipped …) and messages by status (sent, delivered, read, failed, unknown, held …).
          additionalProperties: { type: integer, format: int64 }
        scheduled_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateCampaignRequest:
      type: object
      additionalProperties: false
      required: [name, template_name, template_language, audience]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone_number_id: { type: string, format: uuid }
        template_name: { type: string, minLength: 1, maxLength: 512 }
        template_language: { type: string, minLength: 2, maxLength: 15 }
        template_params: { $ref: "#/components/schemas/CampaignParams" }
        audience: { $ref: "#/components/schemas/CampaignAudience" }
        window_size: { type: integer, minimum: 0, maximum: 10000 }

    UpdateCampaignRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone_number_id: { type: string, format: uuid }
        template_name: { type: string, minLength: 1, maxLength: 512 }
        template_language: { type: string, minLength: 2, maxLength: 15 }
        template_params: { $ref: "#/components/schemas/CampaignParams" }
        audience: { $ref: "#/components/schemas/CampaignAudience" }
        window_size: { type: integer, minimum: 0, maximum: 10000 }

    CampaignEventItem:
      type: object
      required: [id, kind, detail, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        detail: { type: object, additionalProperties: true }
        actor_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    CampaignRecipient:
      type: object
      required: [id, phone, state]
      properties:
        id: { type: string, format: uuid }
        contact_id: { type: [string, "null"], format: uuid }
        phone: { type: string }
        state: { type: string, enum: [pending, queued, skipped, cancelled] }
        skip_reason: { type: [string, "null"] }
        message_id: { type: [string, "null"], format: uuid }
        message_status: { type: [string, "null"] }
        error_code: { type: [string, "null"] }
        error_title: { type: [string, "null"] }

    CampaignResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/Campaign" }, meta: { $ref: "#/components/schemas/Meta" } }
    CampaignListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Campaign" } }
        meta: { $ref: "#/components/schemas/Meta" }
    CampaignEventListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/CampaignEventItem" } }
        meta: { $ref: "#/components/schemas/Meta" }
    CampaignRecipientListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/CampaignRecipient" } }
        meta: { $ref: "#/components/schemas/Meta" }

    # ── Automations (Phase 8) ──────────────────────────────────────────────
    AutomationTriggerType:
      type: string
      enum: [message_received, new_contact, tag_added, message_status, conversation_closed]
      x-enum-varnames: [TriggerMessageReceived, TriggerNewContact, TriggerTagAdded, TriggerMessageStatus, TriggerConversationClosed]

    AutomationTrigger:
      type: object
      additionalProperties: false
      description: Options for the trigger type; see docs/AUTOMATIONS.md.
      properties:
        match: { type: string, enum: [any, contains, exact, starts_with] }
        keywords:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 200 }
        phone_number_id: { type: string, format: uuid }
        tag: { type: string, maxLength: 60 }
        status: { type: string, enum: [delivered, read, failed] }
        campaign_id: { type: string, format: uuid }
        cooldown_seconds: { type: integer, minimum: 0, maximum: 7776000 }

    AutomationStep:
      type: object
      description: >-
        One step: reply, send_template, add_tag, remove_tag, add_to_group, set_field,
        condition (with if/then/else), http_request, send_email, delay, assign,
        close_conversation, mute. Text values accept placeholders such as {{name}},
        {{first_name}}, {{var1}} and {{message}}. See docs/AUTOMATIONS.md.
      required: [type]
      additionalProperties: true
      properties:
        type: { type: string }

    Automation:
      type: object
      required: [id, name, description, active, trigger_type, trigger, steps, version, run_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        active: { type: boolean }
        trigger_type: { $ref: "#/components/schemas/AutomationTriggerType" }
        trigger: { $ref: "#/components/schemas/AutomationTrigger" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/AutomationStep" }
        version: { type: integer }
        run_count: { type: integer, format: int64 }
        last_run_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateAutomationRequest:
      type: object
      additionalProperties: false
      required: [name, trigger_type, steps]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        active: { type: boolean }
        trigger_type: { $ref: "#/components/schemas/AutomationTriggerType" }
        trigger: { $ref: "#/components/schemas/AutomationTrigger" }
        steps:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/AutomationStep" }

    UpdateAutomationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        active: { type: boolean }
        trigger_type: { $ref: "#/components/schemas/AutomationTriggerType" }
        trigger: { $ref: "#/components/schemas/AutomationTrigger" }
        steps:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/AutomationStep" }

    AutomationRunStep:
      type: object
      required: [pc, action, outcome, detail, created_at]
      properties:
        pc: { type: integer }
        action: { type: string }
        outcome: { type: string, enum: [ok, skipped, failed, waiting] }
        detail: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    AutomationRun:
      type: object
      required: [id, automation_id, status, event, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        automation_id: { type: string, format: uuid }
        contact_id: { type: [string, "null"], format: uuid }
        phone: { type: string }
        status: { type: string, enum: [queued, running, waiting, completed, failed, cancelled] }
        event: { type: object, additionalProperties: true }
        error: { type: [string, "null"] }
        resume_at: { type: [string, "null"], format: date-time }
        steps:
          type: array
          items: { $ref: "#/components/schemas/AutomationRunStep" }
        created_at: { type: string, format: date-time }
