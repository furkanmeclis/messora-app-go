          - {id: s2, type: add_tag, tag: order-question}
        layout:
          trigger: {x: 0, "y": 0}
          s1: {x: 0, "y": 140}
          s2: {x: 0, "y": 280}
        version: 3
        run_count: 1284
        last_run_at: "2026-11-25T09:12:08Z"
        created_at: "2026-10-14T11:00:00Z"
        updated_at: "2026-11-20T16:45:00Z"
