            019a8c2e-4f1b-7a0e-9c3d-5e7a1000000e, 019a8c2e-4f1b-7a0f-9c3d-5e7a1000000f]
        expected: {sent: 4123, delivered: 3999, read: 2479, replied: 320, positive: 200, negative: 40, opted_out: 16}
      type: object
      required: [generated_at, category, total, eligible, blocked, warned, blocked_reasons, capacity, limit, start_at, duration_seconds, finish_at, cost, rates, expected]
      properties:
        generated_at: { type: string, format: date-time }
        category: { type: string }
        total: { type: integer, format: int64 }
        eligible: { type: integer, format: int64 }
        blocked: { type: integer, format: int64 }
        warned: { type: integer, format: int64 }
        blocked_reasons: { type: array, items: { $ref: "#/components/schemas/PreflightReason" } }
        capacity:
          type: object
          required: [ceiling_mps, rate_mps, reserved_share, campaign_capacity_mps, share_mps, others]
          properties:
            ceiling_mps: { type: integer }
            rate_mps: { type: integer }
            reserved_share: { type: number, format: double }
            campaign_capacity_mps: { type: number, format: double }
            share_mps: { type: number, format: double, description: The share this campaign would get. }
            others:
              type: array
              items:
                type: object
                required: [id, priority, share_mps]
                properties:
                  id: { type: string, format: uuid }
                  priority: { type: string }
                  share_mps: { type: number, format: double }
        limit:
          type: object
          required: [tier, limit, used, in_flight, remaining, counting, windows]
          properties:
            tier: { type: string }
            limit: { type: integer, format: int64, description: 0 = no limit. }
            used: { type: integer, format: int64 }
            in_flight: { type: integer, format: int64 }
            remaining: { type: integer, format: int64 }
            counting: { type: integer, format: int64, description: Eligible customers that would count against the limit. }
            windows: { type: integer, description: 24-hour limit windows the send needs (1 = fits now). }
        start_at: { type: string, format: date-time }
        duration_seconds: { type: [integer, "null"], format: int64 }
        finish_at: { type: [string, "null"], format: date-time }
        cost:
          type: object
          required: [currency, amount, priced, free, not_in_rate_card, by_country]
          properties:
            currency: { type: string }
            amount: { type: string, description: Decimal total of the priced recipients. }
            priced: { type: integer, format: int64 }
            free: { type: integer, format: int64 }
            not_in_rate_card: { type: integer, format: int64, description: Charged recipients whose country has no rate in the card. }
            by_country:
              type: array
              items:
                type: object
                required: [country, recipients, charged, price, amount]
                properties:
                  country: { type: string }
                  recipients: { type: integer, format: int64 }
                  charged: { type: integer, format: int64 }
                  price: { type: [string, "null"] }
                  amount: { type: [string, "null"] }
        rates:
          type: object
          required: [status, campaigns, recipients, campaigns_needed, recipients_needed, sent_rate, delivery_rate, read_rate, reply_rate, positive_rate, negative_rate, opt_out_rate, based_on]
          properties:
            status: { type: string, enum: [ok, insufficient_history] }
            campaigns: { type: integer }
            recipients: { type: integer, format: int64 }
            campaigns_needed: { type: integer }
            recipients_needed: { type: integer, format: int64 }
            sent_rate: { type: [number, "null"], format: double }
            delivery_rate: { type: [number, "null"], format: double }
            read_rate: { type: [number, "null"], format: double }
            reply_rate: { type: [number, "null"], format: double }
            positive_rate: { type: [number, "null"], format: double }
            negative_rate: { type: [number, "null"], format: double }
            opt_out_rate: { type: [number, "null"], format: double }
            based_on: { type: array, items: { type: string } }
        expected:
          type: object
          required: [sent, delivered, read, replied, positive, negative, opted_out]
          properties:
            sent: { type: [integer, "null"], format: int64 }
            delivered: { type: [integer, "null"], format: int64 }
            read: { type: [integer, "null"], format: int64 }
            replied: { type: [integer, "null"], format: int64 }
            positive: { type: [integer, "null"], format: int64 }
            negative: { type: [integer, "null"], format: int64 }
            opted_out: { type: [integer, "null"], format: int64 }

