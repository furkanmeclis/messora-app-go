    WebhookEventType:
      type: string
      description: See docs/WEBHOOKS.md for each payload.
      enum: [message.received, message.status, conversation.assigned, conversation.closed, conversation.reopened,
             campaign.completed, campaign.failed, campaign.cancelled, contact.created, contact.updated,
             contact.opted_out, contact.opted_in]
      x-enum-varnames: [WebhookMessageReceived, WebhookMessageStatus, WebhookConversationAssigned, WebhookConversationClosed,
                        WebhookConversationReopened, WebhookCampaignCompleted, WebhookCampaignFailed, WebhookCampaignCancelled,
                        WebhookContactCreated, WebhookContactUpdated, WebhookContactOptedOut, WebhookContactOptedIn]

    WebhookEventTypeInfo:
      type: object
      required: [type, description]
      properties:
        type: { $ref: "#/components/schemas/WebhookEventType" }
        description: { type: string }

    WebhookEndpoint:
      type: object
      required: [id, url, description, event_types, active, secret_last4, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        description: { type: string }
        event_types: { type: array, items: { $ref: "#/components/schemas/WebhookEventType" } }
        active: { type: boolean }
        secret_last4: { type: string, description: Last four characters of the signing secret. }
        disabled_reason:
          type: [string, "null"]
          description: Set when Messora switched the endpoint off (e.g. the receiver answered 410 Gone).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookEndpointSecret:
      type: object
      required: [endpoint, secret]
      properties:
        endpoint: { $ref: "#/components/schemas/WebhookEndpoint" }
        secret:
          type: string
          description: Signing secret (`whsec_…`). Shown once; store it securely.

    CreateWebhookEndpointRequest:
      type: object
      additionalProperties: false
      required: [url, event_types]
      properties:
        url: { type: string, minLength: 9, maxLength: 2048 }
        description: { type: string, maxLength: 500 }
        event_types:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { $ref: "#/components/schemas/WebhookEventType" }
        active: { type: boolean, default: true }

    UpdateWebhookEndpointRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        url: { type: string, minLength: 9, maxLength: 2048 }
        description: { type: string, maxLength: 500 }
        event_types:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { $ref: "#/components/schemas/WebhookEventType" }
        active: { type: boolean }

    WebhookDeliveryStatus:
      type: string
      enum: [pending, delivering, retrying, succeeded, failed]

    WebhookDelivery:
      type: object
      required: [id, event_id, event_type, endpoint_id, status, attempts, created_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid, description: Sent as `Messora-Event-Id`; the same on every retry. }
        event_type: { type: string }
        endpoint_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/WebhookDeliveryStatus" }
        attempts: { type: integer }
        next_attempt_at: { type: [string, "null"], format: date-time, description: When the next try is due (pending and retrying only). }
        last_attempt_at: { type: [string, "null"], format: date-time }
        last_status_code: { type: [integer, "null"] }
        last_duration_ms: { type: [integer, "null"] }
        last_error: { type: [string, "null"] }
        last_response_body: { type: [string, "null"], description: "First KiB of the receiver's last answer." }
        delivered_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    WebhookEventTypeListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/WebhookEventTypeInfo" } }
        meta: { $ref: "#/components/schemas/Meta" }
    WebhookEndpointResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/WebhookEndpoint" }, meta: { $ref: "#/components/schemas/Meta" } }
    WebhookEndpointListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/WebhookEndpoint" } }
        meta: { $ref: "#/components/schemas/Meta" }
    WebhookEndpointSecretResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/WebhookEndpointSecret" }, meta: { $ref: "#/components/schemas/Meta" } }
    WebhookDeliveryResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/WebhookDelivery" }, meta: { $ref: "#/components/schemas/Meta" } }
    WebhookDeliveryListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } }
        meta: { $ref: "#/components/schemas/Meta" }
