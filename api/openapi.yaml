        duration_seconds: 98
        finish_at: "2026-12-01T09:01:38Z"
        cost:
          currency: USD
          amount: "44.690000"
          priced: 4100
          free: 0
          not_in_rate_card: 65
          by_country:
            - {country: TR, recipients: 4100, charged: 4100, price: "0.010900", amount: "44.690000"}
            - {country: DE, recipients: 65, charged: 65, price: null, amount: null}
        rates:
          status: ok
