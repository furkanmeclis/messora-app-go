        message_id: { type: [string, "null"], format: uuid, description: The customer message the draft answers. }
        sent_message_id: { type: [string, "null"], format: uuid }
        decided_by: { type: [string, "null"], format: uuid }
        decided_at: { type: [string, "null"], format: date-time }
