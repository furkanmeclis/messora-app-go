openapi: 3.1.0
info:
  title: Messora API
  version: 0.2.0
  description: |
    REST API of Messora, a self-hosted WhatsApp Business Cloud API platform.

    **Authentication.** Every operation declares its security requirement:

    - `panel` — only callable by the Messora panel (Next.js BFF) over the
      internal network. Used for sign-in flows.
    - `session` — a signed-in panel user. Scopes are the permissions the
      user's role must grant.
    - `apiKey` — `Authorization: Bearer msk_live_…`. Scopes are the scopes the
      key was created with.

    **Envelope.** Success: `{"data": …, "meta": {"request_id": …}}`. Errors:
    `{"error": {"code", "message", "details"}, "meta": {…}}`.

    **Idempotency.** POST operations accept an `Idempotency-Key` header; a
    retried request with the same key and body returns the stored response.
  license:
    name: Proprietary (Messora Commercial License)
servers:
  - url: /api/v1

tags:
  - name: setup
  - name: auth
  - name: me
  - name: users
  - name: roles
  - name: settings
  - name: audit
  - name: api-keys
    x-displayName: API keys
    description: Check the key used for the request and its scopes.
  - name: system
  - name: channels
    x-displayName: Channels
    description: Connected WhatsApp Business accounts and their phone numbers (the senders).
  - name: templates
    x-displayName: Templates & offers
    description: Message templates approved by Meta, and time-limited offers that fill them.
  - name: messages
    x-displayName: Messages
    description: Send WhatsApp messages and media, and follow their delivery.
  - name: conversations
    x-displayName: Conversations
    description: "The shared inbox: conversations, history, replies, assignment and closing."
  - name: contacts
    x-displayName: Contacts
    description: Contacts with custom fields, tags, groups and consent; bulk changes and exports.
  - name: segments
    x-displayName: Segments
    description: Saved rule-based audiences.
  - name: campaigns
    x-displayName: Campaigns
    description: "Bulk template sends to an audience: preflight, create, start, pause, resume, cancel and follow-up."
  - name: automations
    x-displayName: Automations
    description: Trigger-and-steps flows built in the panel (read-only for API keys).
  - name: webhooks
    x-displayName: Webhooks
    description: Endpoints that receive signed event notifications, and their delivery log.
  - name: ai

paths:
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: Whether the first owner account still has to be created
      security: [{ panel: [] }]
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatusResponse" }
        default: { $ref: "#/components/responses/Error" }

  /setup:
    post:
      operationId: completeSetup
      tags: [setup]
      summary: Create the first owner account with the one-time setup token
      security: [{ panel: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteSetupRequest" }
      responses:
        "201":
          description: Owner created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreatedResponse" }
        default: { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with e-mail and password
      security: [{ panel: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in, or a second factor is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        default: { $ref: "#/components/responses/Error" }

  /auth/login/mfa:
    post:
      operationId: loginMfa
      tags: [auth]
      summary: Complete sign-in with a TOTP or recovery code
      security: [{ panel: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginMfaRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreatedResponse" }
        default: { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      security: [{ session: [] }]
      responses:
        "204": { description: "Signed out" }
        default: { $ref: "#/components/responses/Error" }

  /auth/reauth:
    post:
      operationId: reauthenticate
      tags: [auth]
      summary: Confirm identity before a sensitive action
      description: Valid for 10 minutes on the current session.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthRequest" }
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReauthResponse" }
        default: { $ref: "#/components/responses/Error" }

  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: E-mail a password reset link
      description: Always answers 202 so that registered addresses cannot be discovered.
      security: [{ panel: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202": { description: "If the address is registered, an e-mail was sent" }
        default: { $ref: "#/components/responses/Error" }

  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password with a reset token
      security: [{ panel: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: "Password changed; every session was ended" }
        default: { $ref: "#/components/responses/Error" }

  /auth/capabilities:
    get:
      operationId: getAuthCapabilities
      tags: [auth]
      summary: Which optional sign-in features are available
      security: [{ panel: [] }]
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthCapabilitiesResponse" }
        default: { $ref: "#/components/responses/Error" }

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: The signed-in user, role, permissions and session
      security: [{ session: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMe
      tags: [me]
      summary: Update profile
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        default: { $ref: "#/components/responses/Error" }

  /me/password:
    post:
      operationId: changePassword
      tags: [me]
      summary: Change password; ends every other session
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: "Changed" }
        default: { $ref: "#/components/responses/Error" }

  /me/sessions:
    get:
      operationId: listMySessions
      tags: [me]
      summary: Active sessions of the signed-in user
      security: [{ session: [] }]
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionListResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeOtherSessions
      tags: [me]
      summary: End every session except the current one
      security: [{ session: [] }]
      responses:
        "204": { description: "Revoked" }
        default: { $ref: "#/components/responses/Error" }

  /me/sessions/{sessionId}:
    delete:
      operationId: revokeMySession
      tags: [me]
      summary: End one of the user's sessions
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "204": { description: "Revoked" }
        default: { $ref: "#/components/responses/Error" }

  /me/mfa/totp:
    post:
      operationId: startTotpSetup
      tags: [me]
      summary: Generate a TOTP secret to enrol an authenticator app
      description: Requires recent re-authentication.
      security: [{ session: [] }]
      responses:
        "200":
          description: Secret and otpauth URI (not active until confirmed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetupResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: disableTotp
      tags: [me]
      summary: Turn off two-factor authentication
      description: Requires recent re-authentication. Refused when the user's role requires two-factor authentication.
      security: [{ session: [] }]
      responses:
        "204": { description: "Disabled" }
        default: { $ref: "#/components/responses/Error" }

  /me/mfa/totp/confirm:
    post:
      operationId: confirmTotp
      tags: [me]
      summary: Activate TOTP with a code from the app; returns recovery codes once
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpConfirmRequest" }
      responses:
        "200":
          description: Enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodesResponse" }
        default: { $ref: "#/components/responses/Error" }

  /me/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [me]
      summary: Replace all recovery codes
      description: Requires recent re-authentication.
      security: [{ session: [] }]
      responses:
        "200":
          description: New codes (shown once)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodesResponse" }
        default: { $ref: "#/components/responses/Error" }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: All panel users
      security: [{ session: [users.manage] }]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /users/{userId}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Change a user's role or status
      security: [{ session: [users.manage] }]
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        default: { $ref: "#/components/responses/Error" }

  /invitations:
    get:
      operationId: listInvitations
      tags: [users]
      summary: Pending invitations
      security: [{ session: [users.manage] }]
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvitation
      tags: [users]
      summary: Invite someone by e-mail
      description: The response contains the acceptance link once, so it can be shared when e-mail is not configured.
      security: [{ session: [users.manage] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitationRequest" }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreatedResponse" }
        default: { $ref: "#/components/responses/Error" }

  /invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      tags: [users]
      summary: Revoke a pending invitation
      security: [{ session: [users.manage] }]
      parameters:
        - { $ref: "#/components/parameters/InvitationId" }
      responses:
        "204": { description: "Revoked" }
        default: { $ref: "#/components/responses/Error" }

  /invitations/lookup:
    post:
      operationId: lookupInvitation
      tags: [users]
      summary: Show who an invitation token is for
      security: [{ panel: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationTokenRequest" }
      responses:
        "200":
          description: Invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreviewResponse" }
        default: { $ref: "#/components/responses/Error" }

  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [users]
      summary: Accept an invitation and create the account
      security: [{ panel: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInvitationRequest" }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreatedResponse" }
        default: { $ref: "#/components/responses/Error" }

  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: Roles and the permissions they grant
      security: [{ session: [users.manage] }]
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Workspace settings
      security: [{ session: [settings.read] }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Change workspace settings
      security: [{ session: [settings.update] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSettingsRequest" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        default: { $ref: "#/components/responses/Error" }

  /settings/meta-rates:
    get:
      operationId: listMetaRates
      tags: [settings]
      summary: Imported Meta rate card
      description: >-
        Meta's per-message prices as imported from CSV, used to price each
        billable message. Meta publishes no pricing API; see docs/WHATSAPP.md
        ("Rate card") for the import format.
      security: [{ session: [settings.read] }]
      responses:
        "200":
          description: Rates, newest first within each market and category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetaRateListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /settings/meta-rates/import:
    post:
      operationId: importMetaRates
      tags: [settings]
      summary: Import Meta's rate card from CSV
      description: >-
        Multipart upload with a `file` field holding a CSV with the columns
        market, countries, category, price, currency, effective_from and
        optionally tier_lower, tier_upper and source (at most 2 MB). Rows add
        to or replace the stored rates of the same currency, market,
        category, tier and date; a rate stays valid until the next date of
        its market and category. The whole file is rejected when any row is
        invalid.
      security: [{ session: [settings.update] }]
      x-messora-raw-body: 2097152
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetaRateImportResponse" }
        default: { $ref: "#/components/responses/Error" }

  /ai/settings:
    get:
      operationId: getAISettings
      tags: [ai]
      summary: Company AI settings
      description: >-
        The master switch (while `enabled` is false every AI request fails
        with AI_DISABLED), the default provider and model, and the texts the
        AI uses to disclose itself and to explain data sharing.
      security: [{ session: [ai.read] }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISettingsResponse" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateAISettings
      tags: [ai]
      summary: Change the company AI settings
      security: [{ session: [ai.manage] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAISettingsRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISettingsResponse" }
        default: { $ref: "#/components/responses/Error" }

  /ai/providers:
    get:
      operationId: listAIProviders
      tags: [ai]
      summary: Connected AI providers
      description: API keys are never returned; `key_last4` identifies the key.
      security: [{ session: [ai.read] }]
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProviderListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAIProvider
      tags: [ai]
      summary: Connect an AI provider
      description: >-
        Stores the key encrypted and checks it right away (free calls: the
        model list, or DeepSeek's balance); the outcome is the `status`.
        `base_url` is only accepted for DeepSeek and OpenAI-compatible
        endpoints and must be https.
      security: [{ session: [ai.manage] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAIProviderRequest" }
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProviderResponse" }
        default: { $ref: "#/components/responses/Error" }

  /ai/providers/{providerId}:
    parameters: [{ $ref: "#/components/parameters/ProviderId" }]
    patch:
      operationId: updateAIProvider
      tags: [ai]
      summary: Rename, rotate the key, change the endpoint or disable a provider
      description: A new key or endpoint is checked immediately. An empty `base_url` removes the override.
      security: [{ session: [ai.manage] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAIProviderRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProviderResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAIProvider
      tags: [ai]
      summary: Remove a provider and its models
      description: Profiles using it fall back to the company default; a deleted default is cleared.
      security: [{ session: [ai.manage] }]
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }

  /ai/providers/{providerId}/check:
    parameters: [{ $ref: "#/components/parameters/ProviderId" }]
    post:
      operationId: checkAIProvider
      tags: [ai]
      summary: Check the stored key again
      security: [{ session: [ai.manage] }]
      responses:
        "200":
          description: Checked; see status and status_detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProviderResponse" }
        default: { $ref: "#/components/responses/Error" }

  /ai/providers/{providerId}/sync:
    parameters: [{ $ref: "#/components/parameters/ProviderId" }]
    post:
      operationId: syncAIModels
      tags: [ai]
      summary: Refresh the provider's model list now
      description: The list is also refreshed daily. Models the provider no longer lists are removed.
      security: [{ session: [ai.manage] }]
      responses:
        "200":
          description: Synced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIModelSyncResponse" }
        default: { $ref: "#/components/responses/Error" }

  /ai/models:
    get:
      operationId: listAIModels
      tags: [ai]
      summary: Model catalogue with today's prices
      description: >-
        Limits and capabilities as each provider's list endpoint reports
        them; `null` means the provider does not say (unknown). `price` is
        the price row valid today, or null when none matches.
      security: [{ session: [ai.read] }]
      responses:
        "200":
          description: Models
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIModelListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /ai/prices:
    get:
      operationId: listAIPrices
      tags: [ai]
      summary: AI price table (per 1M tokens)
      description: >-
        No provider publishes prices through an API. Rows come from the
        shipped seed (unconfirmed), a LiteLLM import (unconfirmed) or an
        admin; `confirmed` rows were checked by an admin.
      security: [{ session: [ai.read] }]
      responses:
        "200":
          description: Prices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIPriceListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAIPrice
      tags: [ai]
      summary: Add a price row (counts as confirmed by the admin)
      security: [{ session: [ai.manage] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAIPriceRequest" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIPriceResponse" }
        default: { $ref: "#/components/responses/Error" }

  /ai/prices/{priceId}:
    parameters: [{ $ref: "#/components/parameters/PriceId" }]
    patch:
      operationId: updateAIPrice
      tags: [ai]
      summary: Edit or confirm a price row
      description: >-
        `confirm: true` records the admin as having checked the row against
        its source. Changing any figure without confirming clears an earlier
        confirmation. Costs already recorded never change.
      security: [{ session: [ai.manage] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAIPriceRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIPriceResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAIPrice
      tags: [ai]
      summary: Remove a price row
      security: [{ session: [ai.manage] }]
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }

  /ai/prices/import:
    post:
      operationId: importAIPrices
      tags: [ai]
      summary: Import prices from LiteLLM's price list
      description: >-
        Multipart upload with a `file` field holding LiteLLM's
        model_prices_and_context_window.json (MIT licensed, per-token
        prices; at most 16 MB) and an optional `effective_from` date
        (default today). OpenAI, Anthropic, Gemini and DeepSeek chat models
        are converted to per-1M prices, including long-context thresholds
        and cache prices. Imported rows replace rows of the same model and
        date and are unconfirmed. Messora never downloads the file itself.
      security: [{ session: [ai.manage] }]
      x-messora-raw-body: 16777216
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                effective_from: { type: string, format: date }
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIPriceImportResponse" }
        default: { $ref: "#/components/responses/Error" }

  /ai/profiles:
    get:
      operationId: listAIProfiles
      tags: [ai]
      summary: AI profiles
      security: [{ session: [ai.read] }]
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProfileListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAIProfile
      tags: [ai]
      summary: Create an AI profile
      description: A phone number has at most one profile. `handoff.on_request` is always true.
      security: [{ session: [ai.manage] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIProfileInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProfileResponse" }
        default: { $ref: "#/components/responses/Error" }

  /ai/profiles/{profileId}:
    parameters: [{ $ref: "#/components/parameters/ProfileId" }]
    get:
      operationId: getAIProfile
      tags: [ai]
      summary: One AI profile
      security: [{ session: [ai.read] }]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProfileResponse" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateAIProfile
      tags: [ai]
      summary: Replace an AI profile's configuration
      description: Fields left out take their defaults.
      security: [{ session: [ai.manage] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIProfileInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProfileResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAIProfile
      tags: [ai]
      summary: Delete an AI profile
      security: [{ session: [ai.manage] }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /ai/profiles/{profileId}/test:
    parameters: [{ $ref: "#/components/parameters/ProfileId" }]
    post:
      operationId: testAIProfile
      tags: [ai]
      summary: Run a sample conversation through the profile
      description: >-
        Sends the conversation with the profile's instructions and reply
        schema to its model and returns the structured reply. Nothing is
        sent to a customer; the request is recorded in AI usage with
        purpose `test`. Fails with AI_DISABLED while AI is off.
      security: [{ session: [ai.manage] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestAIProfileRequest" }
      responses:
        "200":
          description: The model's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AITestResultResponse" }
        default: { $ref: "#/components/responses/Error" }

  /appearance:
    get:
      operationId: getAppearance
      tags: [settings]
      summary: Look and regional defaults for every page, including sign-in
      security: [{ panel: [] }]
      responses:
        "200":
          description: Appearance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceResponse" }
        default: { $ref: "#/components/responses/Error" }

  /appearance/logo:
    get:
      operationId: getLogo
      tags: [settings]
      summary: The organisation logo
      security: [{ panel: [] }]
      responses:
        "200":
          description: Logo image (PNG, JPEG, WebP or SVG)
          content:
            image/*:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /settings/logo:
    put:
      operationId: uploadLogo
      tags: [settings]
      summary: Replace the organisation logo
      description: Send the raw PNG, JPEG, WebP or SVG file (at most 2 MB) with its Content-Type.
      security: [{ session: [settings.update] }]
      x-messora-raw-body: 2097152
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteLogo
      tags: [settings]
      summary: Remove the organisation logo
      security: [{ session: [settings.update] }]
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        default: { $ref: "#/components/responses/Error" }

  /settings/smtp:
    get:
      operationId: getSmtpSettings
      tags: [settings]
      summary: Outgoing e-mail configuration (never the password)
      security: [{ session: [settings.read] }]
      responses:
        "200":
          description: SMTP settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmtpSettingsResponse" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateSmtpSettings
      tags: [settings]
      summary: Change the outgoing e-mail configuration
      description: Refused with SMTP_MANAGED_BY_ENV while SMTP_HOST is set. An empty host turns e-mail off.
      security: [{ session: [settings.update] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmtpSettingsInput" }
      responses:
        "200":
          description: SMTP settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmtpSettingsResponse" }
        default: { $ref: "#/components/responses/Error" }

  /settings/consent:
    get:
      operationId: getConsentSettings
      tags: [settings]
      summary: Subscription and consent settings
      security: [{ session: [settings.read] }]
      responses:
        "200":
          description: Consent settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentSettingsResponse" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateConsentSettings
      tags: [settings]
      summary: Change the subscription and consent settings
      security: [{ session: [settings.update] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentSettings" }
      responses:
        "200":
          description: Consent settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentSettingsResponse" }
        default: { $ref: "#/components/responses/Error" }

  /settings/smtp/test:
    post:
      operationId: testSmtpSettings
      tags: [settings]
      summary: Send a test e-mail with the saved configuration, or with an unsaved one
      security: [{ session: [settings.update] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmtpTestRequest" }
      responses:
        "204": { description: Sent }
        default: { $ref: "#/components/responses/Error" }

  /license:
    get:
      operationId: getLicense
      tags: [settings]
      summary: The installation's licence and what it allows
      security: [{ session: [settings.read] }]
      responses:
        "200":
          description: Licence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseInfoResponse" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setLicense
      tags: [settings]
      summary: Enter or replace the licence key (owner only)
      security: [{ session: [settings.update] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetLicenseRequest" }
      responses:
        "200":
          description: Licence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseInfoResponse" }
        default: { $ref: "#/components/responses/Error" }

  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: Audit trail, newest first
      security: [{ session: [audit.read] }]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: entity_type
          in: query
          schema: { type: string, maxLength: 50 }
        - name: entity_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: API keys (secrets are never returned again)
      security: [{ session: [api_keys.manage] }]
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: Create an API key; the secret is shown once
      description: Requires recent re-authentication. Scopes cannot exceed the creator's permissions.
      security: [{ session: [api_keys.manage] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreatedResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api-keys/{apiKeyId}:
    delete:
      operationId: revokeApiKey
      tags: [api-keys]
      summary: Revoke an API key immediately
      security: [{ session: [api_keys.manage] }]
      parameters:
        - { $ref: "#/components/parameters/ApiKeyId" }
      responses:
        "204": { description: "Revoked" }
        default: { $ref: "#/components/responses/Error" }

  /api-keys/whoami:
    get:
      operationId: getApiKeySelf
      tags: [api-keys]
      summary: Describe the API key used for this request
      description: Lets integrations verify their credentials and scopes.
      security: [{ apiKey: [] }]
      responses:
        "200":
          description: The calling key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /system/status:
    get:
      operationId: getSystemStatus
      tags: [system]
      summary: Health of every component of the installation
      security: [{ session: [settings.read] }]
      responses:
        "200":
          description: Component status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatusResponse" }
        default: { $ref: "#/components/responses/Error" }

  /system/failed-jobs:
    get:
      operationId: listFailedJobs
      tags: [system]
      summary: Background jobs that ran out of retries (dead letter), newest first
      description: >-
        Payloads are never returned: only identifier fields (keys ending in
        `_id`) are listed in `refs`.
      security: [{ session: [settings.read] }]
      parameters:
        - name: queue
          in: query
          schema: { $ref: "#/components/schemas/QueueName" }
        - name: page
          in: query
          description: 1-based page number; meta.total is the number of failed jobs.
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Failed jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FailedJobListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /system/failed-jobs/{queue}/{jobId}:
    parameters:
      - { $ref: "#/components/parameters/QueuePath" }
      - { $ref: "#/components/parameters/JobId" }
    delete:
      operationId: deleteFailedJob
      tags: [system]
      summary: Discard a failed job
      security: [{ session: [settings.update] }]
      responses:
        "204": { description: "Deleted" }
        default: { $ref: "#/components/responses/Error" }

  /system/failed-jobs/{queue}/{jobId}/retry:
    parameters:
      - { $ref: "#/components/parameters/QueuePath" }
      - { $ref: "#/components/parameters/JobId" }
    post:
      operationId: retryFailedJob
      tags: [system]
      summary: Run a failed job again now
      description: >-
        The job is queued once more; if it fails again it returns to the
        failed list immediately (its retry budget is already spent).
      security: [{ session: [settings.update] }]
      responses:
        "204": { description: "Queued" }
        default: { $ref: "#/components/responses/Error" }

  /channels/accounts:
    get:
      operationId: listWhatsAppAccounts
      tags: [channels]
      summary: Connected WhatsApp Business Accounts (credentials are never returned)
      security: [{ session: [channels.read] }]
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppAccountListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: connectWhatsAppAccount
      tags: [channels]
      summary: Connect a WhatsApp Business Account
      description: The access token is verified against Meta before anything is stored; phone numbers and templates are imported.
      security: [{ session: [channels.manage] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectWhatsAppAccountRequest" }
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppAccountResponse" }
        default: { $ref: "#/components/responses/Error" }

  /channels/accounts/{accountId}:
    patch:
      operationId: updateWhatsAppAccount
      tags: [channels]
      summary: Rename, rotate credentials, or enable/disable an account
      security: [{ session: [channels.manage] }]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWhatsAppAccountRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppAccountResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: disconnectWhatsAppAccount
      tags: [channels]
      summary: Disconnect an account without message history
      security: [{ session: [channels.manage] }]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "204": { description: Disconnected }
        default: { $ref: "#/components/responses/Error" }

  /channels/accounts/{accountId}/check:
    post:
      operationId: checkWhatsAppAccount
      tags: [channels]
      summary: Check the access token with Meta now (validity, permissions, expiry)
      description: >-
        Re-validates the stored token. A token Meta refuses flags the account;
        a working token brings a flagged account back into service.
      security: [{ session: [channels.manage] }]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: The account after the check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppAccountResponse" }
        default: { $ref: "#/components/responses/Error" }

  /channels/accounts/{accountId}/sync:
    post:
      operationId: syncWhatsAppAccount
      tags: [channels]
      summary: Refresh phone numbers and templates from Meta
      security: [{ session: [channels.manage] }]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResultResponse" }
        default: { $ref: "#/components/responses/Error" }

  /channels/phone-numbers:
    get:
      operationId: listPhoneNumbers
      tags: [channels]
      summary: Phone numbers of every connected account
      description: >-
        WhatsApp phone numbers of every connected Business account, with Meta's quality rating,
        messaging limit and throughput. Use the `id` as `phone_number_id` when sending.
      security: [{ session: [channels.read] }, { apiKey: [messages.send] }]
      responses:
        "200":
          description: Numbers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneNumberListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /channels/phone-numbers/{phoneNumberId}/default:
    post:
      operationId: setDefaultPhoneNumber
      tags: [channels]
      summary: Use this number when a request names no sender
      security: [{ session: [channels.manage] }]
      parameters:
        - { $ref: "#/components/parameters/PhoneNumberId" }
      responses:
        "204": { description: Updated }
        default: { $ref: "#/components/responses/Error" }

  /channels/webhook:
    get:
      operationId: getWebhookSetup
      tags: [channels]
      summary: Values to enter in the Meta App dashboard
      security: [{ session: [channels.manage] }]
      responses:
        "200":
          description: Webhook configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSetupResponse" }
        default: { $ref: "#/components/responses/Error" }

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: Message templates mirrored from Meta
      description: >-
        Message templates mirrored from Meta, with their approval status, category, language and
        components. Filter by account and status. Only `APPROVED` templates can be sent.
      security: [{ session: [templates.read] }, { apiKey: [templates.read] }]
      parameters:
        - name: account_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, maxLength: 40 }
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Submit a template for Meta's review
      security: [{ session: [templates.manage] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTemplateRequest" }
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateResponse" }
        default: { $ref: "#/components/responses/Error" }

  /templates/{templateId}:
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: Delete one language version of a template on Meta and locally
      security: [{ session: [templates.manage] }]
      parameters:
        - { $ref: "#/components/parameters/TemplateId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /offers:
    get:
      operationId: listOffers
      tags: [templates]
      summary: Time-limited offers
      description: >-
        Time-limited offers (title, discount, coupon, start and end), latest end first; filter
        with `status`. A campaign linked to an offer fills limited-time offer templates from it.
      security: [{ session: [templates.read] }, { apiKey: [templates.read] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OfferStatus" }
      responses:
        "200":
          description: Offers, latest end first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createOffer
      tags: [templates]
      summary: Create an offer
      description: >-
        status draft keeps the offer unpublished; scheduled publishes it (it
        becomes active at starts_at, or at once when that has passed). The
        scheduler moves offers to active and expired every minute and
        publishes offer.updated on campaign:all.
      security: [{ session: [templates.manage] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferResponse" }
        default: { $ref: "#/components/responses/Error" }

  /offers/{offerId}:
    get:
      operationId: getOffer
      tags: [templates]
      summary: One offer
      description: >-
        One offer with its template, coupon code, image and validity window.
      security: [{ session: [templates.read] }, { apiKey: [templates.read] }]
      parameters:
        - { $ref: "#/components/parameters/OfferId" }
      responses:
        "200":
          description: The offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateOffer
      tags: [templates]
      summary: Edit, publish or end an offer
      description: >-
        Fields left out keep their value. status scheduled publishes a draft,
        draft unpublishes it, expired ends the offer now (campaigns using it
        pause with reason offer_expired). An expired offer cannot be edited.
      security: [{ session: [templates.manage] }]
      parameters:
        - { $ref: "#/components/parameters/OfferId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteOffer
      tags: [templates]
      summary: Delete an offer (campaigns using it keep their own values)
      security: [{ session: [templates.manage] }]
      parameters:
        - { $ref: "#/components/parameters/OfferId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /messages:
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Queue a WhatsApp message
      description: >-
        The message is stored and sent asynchronously; poll GET /messages/{messageId}
        or use webhooks for the outcome. Outside the 24-hour customer service window
        only approved templates are accepted. Use Idempotency-Key to retry safely.
      security: [{ session: [messages.send] }, { apiKey: [messages.send] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
            examples: {"text": {"summary": "Text (inside the 24-hour window)", "value": {"to": "+905321234567", "type": "text", "text": {"body": "Siparişiniz yola çıktı."}}}, "template": {"summary": "Approved template", "value": {"to": "+905321234567", "type": "template", "template": {"name": "order_shipped", "language": "tr", "components": [{"type": "body", "parameters": [{"type": "text", "text": "Ayşe"}, {"type": "text", "text": "TR123456789"}]}]}}}, "image": {"summary": "Image by link", "value": {"to": "+905321234567", "type": "image", "media": {"link": "https://shop.example.com/img/invoice.jpg", "caption": "Faturanız"}}}}
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /templates/samples:
    post:
      operationId: uploadTemplateSample
      tags: [templates]
      summary: Upload the example file of a media-header template
      description: >-
        Meta reviews media-header templates with an example file. Send it as
        the raw body; the returned handle goes into the header component as
        example.header_handle. Needs the account's App ID. Images (JPEG, PNG)
        up to 5 MB, video (MP4) up to 16 MB, documents (PDF) up to 100 MB.
      security: [{ session: [templates.manage] }]
      x-messora-raw-body: 104857600
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: filename, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 240 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateSampleResponse" }
        default: { $ref: "#/components/responses/Error" }

  /media:
    post:
      operationId: uploadMedia
      tags: [messages]
      summary: Upload a file to send as an image, video, audio, document or sticker
      description: >-
        Send the raw file as the request body with its Content-Type. Meta keeps
        it for 30 days; use the returned id in a message's media.id. Limits:
        images 5 MB, video and audio 16 MB, documents 100 MB, stickers 500 KB.
      security: [{ session: [conversations.reply] }, { session: [messages.send] }, { apiKey: [messages.send] }]
      x-messora-raw-body: 104857600
      parameters:
        - { name: filename, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 240 } }
        - { name: phone_number_id, in: query, schema: { type: string, format: uuid }, description: "Sender whose account stores the file; defaults to the default number." }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadedMediaResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /messages/{messageId}:
    get:
      operationId: getMessage
      tags: [messages]
      summary: A message and its delivery state
      description: >-
        One message and its delivery state (sent, delivered, read or failed with the WhatsApp
        error), plus pricing once Meta has reported it.
      security: [{ session: [messages.send] }, { apiKey: [messages.send] }]
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
      responses:
        "200":
          description: Message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: Contacts, newest first
      description: >-
        Contacts matching the filters, newest first (or by `sort`). Paged with `cursor`, or with
        `page` for numbered pages (then `meta.total` is set).
      security: [{ session: [contacts.read] }, { apiKey: [contacts.read] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Name, phone or e-mail contains" }
        - { name: tag_id, in: query, schema: { type: string, format: uuid } }
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - { name: segment_id, in: query, schema: { type: string, format: uuid } }
        - { name: opted_out, in: query, schema: { type: boolean }, description: "Opted out of everything (both consent categories)." }
        - { name: marketing_consent, in: query, schema: { $ref: "#/components/schemas/ConsentStatus" } }
        - { name: service_consent, in: query, schema: { $ref: "#/components/schemas/ConsentStatus" } }
        - name: reachability
          in: query
          description: "meta_marketing_stopped: stopped marketing in WhatsApp; undeliverable: Meta could not deliver to the number."
          schema: { $ref: "#/components/schemas/Reachability" }
        - { name: sort, in: query, schema: { $ref: "#/components/schemas/ContactSort" } }
        - name: page
          in: query
          description: 1-based page number. With it the list is paged by offset (cursor is ignored) and meta.total is set.
          schema: { type: integer, minimum: 1, maximum: 100000 }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createContact
      tags: [contacts]
      summary: Add a contact
      description: >-
        Adds a contact by phone number (international format; it is normalised to E.164). Tags
        given by name are created when they do not exist. A phone number that already exists
        answers 409.
      security: [{ session: [contacts.create] }, { apiKey: [contacts.create] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContactRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /contacts/attribute-keys:
    get:
      operationId: listContactAttributeKeys
      tags: [contacts]
      summary: Custom attribute keys in use (for {{attr:key}} placeholders)
      description: >-
        The keys of custom contact attributes in use, most used first, for building `{{attr:key}}`
        template placeholders.
      security: [{ session: [contacts.read] }, { apiKey: [contacts.read] }]
      responses:
        "200":
          description: Keys, most used first (at most 200)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { type: string } }
                  meta: { $ref: "#/components/schemas/Meta" }
              example: { "data": ["city", "customer_no", "plan"], "meta": { "request_id": "019a8c2e-4f1b-7fff-9c3d-5e7a1000ffff" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /contacts/bulk:
    post:
      operationId: bulkContacts
      tags: [contacts]
      summary: Apply one action to many contacts
      description: >-
        Targets either the given ids or every contact matching a filter
        (optionally minus exclude_ids), up to 200,000 contacts. Tag, group and
        consent actions need contacts.update; delete needs contacts.delete.
      security: [{ session: [contacts.update] }, { session: [contacts.delete] }, { apiKey: [contacts.update] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactBulkRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactBulkResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /contacts/{contactId}/ai:
    put:
      operationId: setContactAI
      tags: [contacts]
      summary: Allow or disable the AI for a contact
      description: >-
        With `disabled: true` the AI never answers or drafts for the contact;
        its conversations the AI owns go to the team's pool (a handoff with
        reason `manual`) and suggestions stop. Audited.
      security: [{ session: [contacts.update] }, { apiKey: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactAISettingRequest" }
            example: { disabled: true }
      responses:
        "200":
          description: The contact's AI setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactAISettingResponse" }
              example: { data: { contact_id: "0195f0c2-6b1e-7c4a-9d3e-2f1a4b5c6d7e", ai_disabled: true }, meta: { request_id: "req_01" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /contacts/{contactId}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: A contact with tags and groups
      description: >-
        One contact with tags, groups, custom attributes and per-category consent.
      security: [{ session: [contacts.read] }, { apiKey: [contacts.read] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Edit a contact; an empty string clears an optional field
      description: >-
        Changes the given fields only. An empty string clears an optional field; `tags` and
        `group_ids`, when given, replace the current lists.
      security: [{ session: [contacts.update] }, { apiKey: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContactRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Delete a contact and its message history
      description: >-
        Deletes the contact and its message history. This cannot be undone.
      security: [{ session: [contacts.delete] }, { apiKey: [contacts.delete] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /contacts/{contactId}/consent:
    post:
      operationId: recordConsent
      tags: [contacts]
      summary: Change a contact's consent
      description: >-
        Either the legacy kind (opt_in / opt_out, which set both categories) or a
        status for one or both categories. Every change is kept in the consent
        history and the audit log. Opted-out contacts receive no business-initiated
        messages of that category from campaigns, the API or automations;
        docs/CONSENT.md has the rules.
      security: [{ session: [contacts.update] }, { apiKey: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentRequest" }
      responses:
        "200":
          description: Contact after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /contacts/{contactId}/consent-events:
    get:
      operationId: listConsentEvents
      tags: [contacts]
      summary: The contact's consent history, newest first (at most 100)
      description: >-
        Every consent change of the contact (opt-in, opt-out, requests detected from keywords,
        Meta stops) with its source and note, newest first, at most 100.
      security: [{ session: [contacts.read] }, { apiKey: [contacts.read] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
      responses:
        "200":
          description: Consent events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentEventListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /contacts/{contactId}/notes:
    get:
      operationId: listContactNotes
      tags: [contacts]
      summary: Internal notes, newest first
      security: [{ session: [contacts.read] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addContactNote
      tags: [contacts]
      summary: Add an internal note
      security: [{ session: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteResponse" }
        default: { $ref: "#/components/responses/Error" }

  /contacts/{contactId}/notes/{noteId}:
    delete:
      operationId: deleteContactNote
      tags: [contacts]
      summary: Delete a note
      security: [{ session: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
        - { $ref: "#/components/parameters/NoteId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /contact-exports:
    get:
      operationId: exportContacts
      tags: [contacts]
      summary: Download matching contacts as CSV or Excel
      description: >-
        Streams every contact matching the filters (the same filters as GET /contacts) as a CSV
        file (UTF-8 with a header row) or an Excel workbook. Large exports are streamed, not
        buffered.
      security: [{ session: [contacts.export] }, { apiKey: [contacts.export] }]
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx], default: csv } }
        - { name: opted_out, in: query, schema: { type: boolean } }
        - { name: marketing_consent, in: query, schema: { $ref: "#/components/schemas/ConsentStatus" } }
        - { name: service_consent, in: query, schema: { $ref: "#/components/schemas/ConsentStatus" } }
        - { name: reachability, in: query, schema: { $ref: "#/components/schemas/Reachability" } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: tag_id, in: query, schema: { type: string, format: uuid } }
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - { name: segment_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: CSV (UTF-8 with header row) or Excel workbook
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /contact-imports:
    get:
      operationId: listContactImports
      tags: [contacts]
      summary: Recent imports
      security: [{ session: [contacts.import] }]
      responses:
        "200":
          description: Imports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactImportListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: uploadContactImport
      tags: [contacts]
      summary: Upload a CSV or Excel (.xlsx) file (up to 50 MB) to import
      description: >-
        Send the raw file as the request body. The response lists the detected
        columns and the first rows so a column mapping can be chosen; nothing is
        imported until the import is started.
      security: [{ session: [contacts.import] }]
      x-messora-raw-body: 52428800
      parameters:
        - { name: filename, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactImportResponse" }
        default: { $ref: "#/components/responses/Error" }

  /contact-imports/{importId}:
    get:
      operationId: getContactImport
      tags: [contacts]
      summary: Import progress and results
      security: [{ session: [contacts.import] }]
      parameters:
        - { $ref: "#/components/parameters/ImportId" }
      responses:
        "200":
          description: Import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactImportResponse" }
        default: { $ref: "#/components/responses/Error" }

  /contact-imports/{importId}/start:
    post:
      operationId: startContactImport
      tags: [contacts]
      summary: Choose the column mapping and start importing
      security: [{ session: [contacts.import] }]
      parameters:
        - { $ref: "#/components/parameters/ImportId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartContactImportRequest" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactImportResponse" }
        default: { $ref: "#/components/responses/Error" }

  /contact-imports/{importId}/cancel:
    post:
      operationId: cancelContactImport
      tags: [contacts]
      summary: Stop an import; rows already imported stay
      security: [{ session: [contacts.import] }]
      parameters:
        - { $ref: "#/components/parameters/ImportId" }
      responses:
        "200":
          description: Import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactImportResponse" }
        default: { $ref: "#/components/responses/Error" }

  /contact-imports/{importId}/errors:
    get:
      operationId: getContactImportErrors
      tags: [contacts]
      summary: Rows that could not be imported, with the reason, as CSV
      security: [{ session: [contacts.import] }]
      parameters:
        - { $ref: "#/components/parameters/ImportId" }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /tags:
    get:
      operationId: listTags
      tags: [contacts]
      summary: Tags with contact counts
      description: >-
        Tags with the number of contacts that carry them.
      security: [{ session: [contacts.read] }, { apiKey: [contacts.read] }]
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createTag
      tags: [contacts]
      summary: Create a tag (returns the existing one for a duplicate name)
      security: [{ session: [contacts.update] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagInput" }
      responses:
        "201":
          description: Tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagResponse" }
        default: { $ref: "#/components/responses/Error" }

  /tags/{tagId}/insights:
    get:
      operationId: getTagInsights
      tags: [contacts]
      summary: How the tag performs and every campaign that reached its contacts
      description: >-
        Counts, the last 90 days of messages, the daily activity of the last
        30 days and each campaign that reached at least one of its contacts
        (targeted at it or not), measured on those contacts only.
      security: [{ session: [contacts.read, campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/TagId" }
        - { name: tz, in: query, schema: { type: string, maxLength: 64 }, description: IANA time zone of the daily series (default UTC). }
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AudienceInsightsResponse" }
        default: { $ref: "#/components/responses/Error" }

  /tags/{tagId}:
    patch:
      operationId: updateTag
      tags: [contacts]
      summary: Rename or recolour a tag
      security: [{ session: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/TagId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagInput" }
      responses:
        "200":
          description: Tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTag
      tags: [contacts]
      summary: Delete a tag from every contact
      security: [{ session: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/TagId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /groups:
    get:
      operationId: listGroups
      tags: [contacts]
      summary: Contact groups with member counts
      description: >-
        Contact groups with their member counts. Use a group as a campaign audience or to filter
        contacts.
      security: [{ session: [contacts.read] }, { apiKey: [contacts.read] }]
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createGroup
      tags: [contacts]
      summary: Create a group
      security: [{ session: [contacts.update] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupResponse" }
        default: { $ref: "#/components/responses/Error" }

  /groups/{groupId}/insights:
    get:
      operationId: getGroupInsights
      tags: [contacts]
      summary: How the group performs and every campaign that reached its contacts
      description: >-
        Counts, the last 90 days of messages, the daily activity of the last
        30 days and each campaign that reached at least one of its contacts
        (targeted at it or not), measured on those contacts only.
      security: [{ session: [contacts.read, campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { name: tz, in: query, schema: { type: string, maxLength: 64 }, description: IANA time zone of the daily series (default UTC). }
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AudienceInsightsResponse" }
        default: { $ref: "#/components/responses/Error" }

  /groups/{groupId}:
    patch:
      operationId: updateGroup
      tags: [contacts]
      summary: Rename or describe a group
      security: [{ session: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteGroup
      tags: [contacts]
      summary: Delete a group (contacts stay)
      security: [{ session: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /groups/{groupId}/members:
    post:
      operationId: changeGroupMembers
      tags: [contacts]
      summary: Add or remove contacts
      description: >-
        Adds contacts to the group or removes them from it, up to 1000 per request. Returns how
        many memberships changed.
      security: [{ session: [contacts.update] }, { apiKey: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupMembersRequest" }
      responses:
        "200":
          description: Rows changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /segments:
    get:
      operationId: listSegments
      tags: [segments]
      summary: Saved segments
      description: >-
        Saved segments (dynamic audiences defined by rules on contact fields, tags and groups).
      security: [{ session: [segments.read] }, { apiKey: [segments.read] }]
      responses:
        "200":
          description: Segments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSegment
      tags: [segments]
      summary: Save a segment
      security: [{ session: [segments.manage] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SegmentInput" }
      responses:
        "201":
          description: Segment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentResponse" }
        default: { $ref: "#/components/responses/Error" }

  /segments/preview:
    post:
      operationId: previewSegment
      tags: [segments]
      summary: Count matching contacts and show a sample, without saving
      security: [{ session: [segments.read] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [definition]
              properties:
                definition: { $ref: "#/components/schemas/SegmentDefinition" }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentPreviewResponse" }
        default: { $ref: "#/components/responses/Error" }

  /segments/{segmentId}/insights:
    get:
      operationId: getSegmentInsights
      tags: [contacts]
      summary: How the segment performs and every campaign that reached its contacts
      description: >-
        Counts, the last 90 days of messages, the daily activity of the last
        30 days and each campaign that reached at least one of its contacts
        (targeted at it or not), measured on those contacts only.
      security: [{ session: [segments.read, campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/SegmentId" }
        - { name: tz, in: query, schema: { type: string, maxLength: 64 }, description: IANA time zone of the daily series (default UTC). }
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AudienceInsightsResponse" }
        default: { $ref: "#/components/responses/Error" }

  /segments/{segmentId}:
    get:
      operationId: getSegment
      tags: [segments]
      summary: A segment with its current size
      description: >-
        One segment with its rule definition and the number of contacts that match it now.
      security: [{ session: [segments.read] }, { apiKey: [segments.read] }]
      parameters:
        - { $ref: "#/components/parameters/SegmentId" }
      responses:
        "200":
          description: Segment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSegment
      tags: [segments]
      summary: Edit a segment
      security: [{ session: [segments.manage] }]
      parameters:
        - { $ref: "#/components/parameters/SegmentId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSegmentRequest" }
      responses:
        "200":
          description: Segment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSegment
      tags: [segments]
      summary: Delete a segment
      security: [{ session: [segments.manage] }]
      parameters:
        - { $ref: "#/components/parameters/SegmentId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  # ── Realtime (Phase 6) ────────────────────────────────────────────────────
  /realtime/connection-token:
    post:
      operationId: createRealtimeConnectionToken
      tags: [realtime]
      summary: Token for opening a Centrifugo connection
      description: >-
        A short-lived HS256 JWT for Centrifugo with the user as subject. The
        user's personal channel and system notices are subscribed server-side.
        The client asks for a new token before this one expires.
      security: [{ session: [] }]
      responses:
        "200":
          description: Connection token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealtimeTokenResponse" }
        default: { $ref: "#/components/responses/Error" }

  /realtime/subscription-token:
    post:
      operationId: createRealtimeSubscriptionToken
      tags: [realtime]
      summary: Token for subscribing to one channel
      description: >-
        Issued only when the user may read the channel: `inbox:all` needs
        conversations.read_all, `inbox:unassigned` needs conversations.read
        or conversations.read_all, `conversation:<id>` needs
        conversations.read_all, or conversations.read when the
        conversation is assigned to the user or to nobody, `campaign:all` and `campaign:<id>` need
        campaigns.read. Any other channel answers 403 CHANNEL_FORBIDDEN.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealtimeSubscriptionRequest" }
      responses:
        "200":
          description: Subscription token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealtimeTokenResponse" }
        default: { $ref: "#/components/responses/Error" }

  /realtime/sync:
    get:
      operationId: getRealtimeSync
      tags: [realtime]
      summary: Current state of what changed on a channel since a moment
      description: >-
        For clients that missed events and could not recover them from
        Centrifugo's history. Returns snapshots as the events the channel
        carries, oldest change first: `conversation.updated` for
        `inbox:all`, `inbox:unassigned`, the caller's `personal:#<id>` and
        `conversation:<id>` (only conversations the caller may read and the
        channel would announce), `campaign.updated` for `campaign:all` and
        `campaign:<id>` (changed since, plus every active campaign). At most
        200 conversations or 50 campaigns; `has_more` asks the client to
        reload instead. Channel permissions are those of the subscription
        token; a channel the caller may not read answers 403
        CHANNEL_FORBIDDEN.
      security: [{ session: [] }]
      parameters:
        - { name: channel, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 128 } }
        - { name: since, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealtimeSyncResponse" }
        default: { $ref: "#/components/responses/Error" }

  # ── Campaigns (Phase 5) ──────────────────────────────────────────────────
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: Campaigns, newest first
      description: >-
        Campaigns of every status, newest first; filter with `status`. `counts` holds live
        recipient and message counts. Paged with `cursor`.
      security: [{ session: [campaigns.read] }, { apiKey: [campaigns.read] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/CampaignStatus" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Campaigns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a draft campaign
      description: >-
        Creates a campaign in `draft` status: a template, its parameters and exactly one audience
        (segment, group, tag or all contacts). Nothing is sent until you start it. Check the
        audience first with POST /campaigns/preflight.
      security: [{ session: [campaigns.create] }, { apiKey: [campaigns.create] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCampaignRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/queue:
    get:
      operationId: getCampaignQueue
      tags: [campaigns]
      summary: The send queue per phone number
      description: >-
        Per sending number: its throughput (Meta's ceiling and the current
        adaptive rate), the share reserved for inbox, API and automation
        messages, the portfolio messaging limit and its use, and the campaigns
        sharing the rest with their priority, fair share, measured rate and
        estimated time left. Running campaigns share by weighted fair queuing
        (high 4, normal 2, low 1).
      security: [{ session: [campaigns.read] }, { apiKey: [campaigns.read] }]
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignQueueResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/preflight:
    post:
      operationId: preflightCampaign
      tags: [campaigns]
      summary: How many recipients of an audience may receive a template
      description: >-
        Counts the audience by what the consent rules decide for the template's
        category: eligible (including those with a warning), blocked by a hard rule
        that nothing overrides (opted out, stopped in WhatsApp, undeliverable), and
        blocked or warned by the company's policy. Nothing is stored.
      security: [{ session: [campaigns.create] }, { apiKey: [campaigns.create] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignPreflightRequest" }
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignPreflightResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/forecast:
    post:
      operationId: forecastCampaign
      tags: [campaigns]
      summary: Pre-launch analysis of a campaign
      description: >-
        Who would get the campaign (consent preflight), how long it takes with the
        number's capacity, the other running campaigns and the portfolio's messaging
        limit (possibly several 24-hour windows), the estimated Meta cost from the
        imported rate card (recipient country × template category, 2026-10-01
        charging rules; countries without a rate are counted in not_in_rate_card,
        never guessed) and, only with enough history (at least 3 completed campaigns
        of the same template category and 500 recipients), expected rates. Without
        history rates.status is insufficient_history with what is missing. Nothing is
        stored; the forecast is fixed when the campaign starts.
      security: [{ session: [campaigns.create] }, { apiKey: [campaigns.create] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignForecastRequest" }
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignForecastResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: A campaign with live counts
      description: >-
        The campaign with live counts: recipients by state and messages by delivery status.
      security: [{ session: [campaigns.read] }, { apiKey: [campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Edit a draft or scheduled campaign
      description: >-
        Changes a campaign that has not started yet (`draft` or `scheduled`). Only the given
        fields change. A running or finished campaign answers 409.
      security: [{ session: [campaigns.create] }, { apiKey: [campaigns.create] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCampaignRequest" }
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign that is not running or paused
      security: [{ session: [campaigns.delete] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/start:
    post:
      operationId: startCampaign
      tags: [campaigns]
      summary: Start now, or schedule with `scheduled_at`
      description: >-
        Starts a draft campaign now, or schedules it when `scheduled_at` (a future time) is given.
        Consent rules are checked again for every message right before it is sent.
      security: [{ session: [campaigns.start] }, { apiKey: [campaigns.start] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scheduled_at: { type: string, format: date-time }
            example: { "scheduled_at": "2026-11-26T07:00:00Z" }
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/pause:
    post:
      operationId: pauseCampaign
      tags: [campaigns]
      summary: Pause sending; unsent messages are held
      description: >-
        Pauses a running campaign. Messages not handed to WhatsApp yet are held and go out after
        POST /campaigns/{campaignId}/resume; nothing is sent twice.
      security: [{ session: [campaigns.pause] }, { apiKey: [campaigns.pause] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/resume:
    post:
      operationId: resumeCampaign
      tags: [campaigns]
      summary: Resume a paused campaign, optionally with changes or later
      description: >-
        Resumes any pause (manual, messaging limit, expired offer …). Recipients
        already sent to are never sent again. Name, priority and rate cap may be
        changed; with resume_at the campaign stays paused until then. Refused when the linked
        offer has ended.
      security: [{ session: [campaigns.start] }, { apiKey: [campaigns.start] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignResumeRequest" }
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/cancel:
    post:
      operationId: cancelCampaign
      tags: [campaigns]
      summary: Stop for good; unsent messages are cancelled
      description: >-
        Stops the campaign for good. Messages already sent stay sent; recipients that were not
        sent yet are cancelled. A cancelled campaign cannot be resumed.
      security: [{ session: [campaigns.pause] }, { apiKey: [campaigns.pause] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/settings:
    patch:
      operationId: updateCampaignSettings
      tags: [campaigns]
      summary: Change name, priority or rate cap while the campaign is in progress
      description: The scheduler uses a new priority or cap from its next tick. Priority changes are audited.
      security: [{ session: [campaigns.start] }, { apiKey: [campaigns.start] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignSettingsRequest" }
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/pauses:
    get:
      operationId: listCampaignPauses
      tags: [campaigns]
      summary: Pause history with the counts at each pause
      description: >-
        The campaign's pauses, newest first (last 100): why it paused (manual,
        messaging limit, expired offer …), who paused it, when it resumes by
        itself, a snapshot of the recipient and message counts at that moment
        and, once resumed, who resumed it and what was changed.
      security: [{ session: [campaigns.read] }, { apiKey: [campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "200":
          description: Pauses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignPauseListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/resume-preview:
    post:
      operationId: previewCampaignResume
      tags: [campaigns]
      summary: What resuming would send, with consent checked again and the estimated time
      description: >-
        Counts the recipients a resume would still send to (pending, waiting
        for a resend, held), what the consent rules decide for them now, the
        rate the campaign would get with the given settings, the estimated
        time, and the portfolio messaging limit left. Nothing is changed.
      security: [{ session: [campaigns.start] }, { apiKey: [campaigns.start] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignSettingsRequest" }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResumePreviewResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/events:
    get:
      operationId: listCampaignEvents
      tags: [campaigns]
      summary: Lifecycle events (started, paused, resumed, completed …)
      description: >-
        The lifecycle of the campaign (created, scheduled, started, paused with reason, resumed,
        completed …), newest first, with who triggered each step.
      security: [{ session: [campaigns.read] }, { apiKey: [campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignEventListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/recipients:
    get:
      operationId: listCampaignRecipients
      tags: [campaigns]
      summary: Recipients with their message state
      description: >-
        The recipients of the campaign with each recipient's state (pending, queued, skipped,
        cancelled), the message status and the failure reason. Filter with `state`; paged with
        `cursor`.
      security: [{ session: [campaigns.read] }, { apiKey: [campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
        - { name: state, in: query, schema: { type: string, enum: [pending, queued, skipped, cancelled, retry] } }
        - { name: class, in: query, description: "Only recipients not reached for this reason.", schema: { $ref: "#/components/schemas/UnreachedClass" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Recipients
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignRecipientListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/recipients/search:
    post:
      operationId: searchCampaignRecipients
      tags: [campaigns]
      summary: The recipients table (filters, sorting, pages, total)
      description: >-
        Statuses are combined with OR (sent, delivered, read, failed, pending,
        unknown, blocked, cancelled, rejected, replied, positive, negative,
        neutral, opted_out and every unreached class); the other filters with
        AND. Offset paging (`offset`, `limit` up to 200, default 50) with the
        matching total in meta.total; `sort` is created (default, newest
        first), name, phone, sent_at, delivered_at, read_at, replied_at or
        cost, a leading - sorting descending. An unknown status or sort key
        answers 422.
      security: [{ session: [campaigns.read] }, { apiKey: [campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignRecipientSearchRequest" }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignRecipientSearchResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/recipients/bulk:
    post:
      operationId: bulkCampaignRecipients
      tags: [campaigns]
      summary: Tag, group or follow up a selection of recipients
      description: >-
        The selection is the filter (all matching) or filter.ids (a page
        selection). follow_up creates a draft campaign with the same number,
        template and reaction mapping whose audience is the selected contacts
        (at most 50,000).
      security: [{ session: [campaigns.create] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignRecipientBulkRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignRecipientBulkResponse" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/recipients/export:
    get:
      operationId: exportCampaignRecipients
      tags: [campaigns]
      summary: Download the matching recipients as CSV or Excel
      description: >-
        The recipients table's filters as query parameters (status
        comma-separated). Streams up to 20,000 rows; larger selections answer
        409 EXPORT_TOO_LARGE and run as a background export (POST
        /campaigns/{campaignId}/exports). An unknown status answers 422.
      security: [{ session: [campaigns.read] }, { apiKey: [campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx], default: csv } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, description: Comma-separated status filters., schema: { type: string, maxLength: 500 } }
        - { name: tag_id, in: query, schema: { type: string, format: uuid } }
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - { name: segment_id, in: query, schema: { type: string, format: uuid } }
        - { name: contact_type, in: query, schema: { type: string, maxLength: 60 } }
        - { name: attr_key, in: query, schema: { type: string, maxLength: 100 } }
        - { name: attr_value, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: CSV (UTF-8 with header row) or Excel workbook
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/recipients/{recipientId}/reaction:
    put:
      operationId: setCampaignRecipientReaction
      tags: [campaigns]
      summary: Label a recipient's reaction by hand
      description: A manual label overrides the system's (quick reply mapping, AI) and is never replaced by it; null clears.
      security: [{ session: [campaigns.create] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
        - { name: recipientId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reaction]
              properties:
                reaction: { type: [string, "null"], enum: [positive, negative, neutral, null] }
      responses:
        "204": { description: Stored }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/reaction-map:
    put:
      operationId: setCampaignReactionMap
      tags: [campaigns]
      summary: Map quick reply buttons to positive, negative or neutral
      description: >-
        Keys are the button payloads or texts. Recipients who already tapped a
        button are relabelled (manual labels stay).
      security: [{ session: [campaigns.create] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reaction_map]
              properties:
                reaction_map: { $ref: "#/components/schemas/ReactionMap" }
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/analytics:
    get:
      operationId: getCampaignAnalytics
      tags: [campaigns]
      summary: The campaign's analysis center
      description: >-
        Metrics tagged by source (meta: what Meta reported — sent, delivered,
        read, failed, rejected and the 131048/131049/131050 errors; system: what
        Messora computed — audience, consent blocks, replies, reactions,
        opt-outs), rates as fractions 0–1 (null without a denominator), cost
        (the per-message estimate from Meta's pricing category × the imported
        rate card, with priced and unpriced counts, and Meta's reconciled daily
        totals for the number, which cover all its messages), AI cost
        attributed to the campaign, the spam and quality section (number
        quality, template status and quality, the account's quality timeline
        and why recipients were not reached) and hourly series.
      security: [{ session: [campaigns.read] }, { apiKey: [campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "200":
          description: Analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignAnalyticsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/breakdown:
    get:
      operationId: getCampaignBreakdown
      tags: [campaigns]
      summary: Figures per group, segment, tag, contact type or attribute value
      description: >-
        The campaign's recipients grouped by `dimension` (group, segment, tag,
        contact_type, or attribute with `attr_key` naming the custom attribute),
        each bucket with recipients, sent, delivered, read, replied, positive,
        negative, opted out and the estimated cost. A contact in two groups
        (tags, segments) counts in both. Buckets are ordered by recipients,
        largest first, at most 100; contacts without a type (or without the
        attribute) form the bucket with key "". attribute without attr_key
        answers 422.
      security: [{ session: [campaigns.read] }, { apiKey: [campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
        - { name: dimension, in: query, required: true, schema: { type: string, enum: [group, segment, tag, contact_type, attribute] } }
        - { name: attr_key, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Buckets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignBreakdownResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/forecast:
    get:
      operationId: getCampaignForecast
      tags: [campaigns]
      summary: The forecast fixed at start, compared with the actual figures
      description: >-
        The forecast stored when the campaign started next to the actual
        figures, metric by metric (total, eligible, blocked, the expected
        counts, the rates, cost and duration_seconds) with the difference
        (delta = actual − forecast, delta_pct relative to the forecast). Same
        definitions for both sides (docs/CAMPAIGN_ANALYTICS.md); live while the
        campaign runs, final once it completed, was cancelled or failed. A
        side without a figure (e.g. expected counts of a forecast made without
        enough history) is null and so are its deltas. forecast is null, with no metrics, for a campaign not
        started yet or started before forecasts existed.
      security: [{ session: [campaigns.read] }, { apiKey: [campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "200":
          description: Forecast vs actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignForecastVsActualResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/exports:
    get:
      operationId: listCampaignExports
      tags: [campaigns]
      summary: Recent exports of the campaign
      security: [{ session: [campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "200":
          description: Exports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignExportListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCampaignExport
      tags: [campaigns]
      summary: Export recipients or the report in the background
      description: >-
        recipients as csv or xlsx (with the table's filters), the report as xlsx
        (sheets Özet, Maliyet, Teslimat, Alıcılar, Segment, Etiket, Tahmin vs
        Gerçek) or pdf (summary). The file is kept for 7 days.
      security: [{ session: [campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignExportRequest" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignExportResponse" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/exports/{exportId}/download:
    get:
      operationId: downloadCampaignExport
      tags: [campaigns]
      summary: Download a finished export
      security: [{ session: [campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
        - { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /settings/campaign-protection:
    get:
      operationId: getCampaignProtectionSettings
      tags: [settings]
      summary: Campaign protection (spam thresholds) and attribution window
      security: [{ session: [settings.read] }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignProtectionSettingsResponse" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateCampaignProtectionSettings
      tags: [settings]
      summary: Change the campaign protection settings
      security: [{ session: [settings.update] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignProtectionSettings" }
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignProtectionSettingsResponse" }
        default: { $ref: "#/components/responses/Error" }

  # ── Inbox (Phase 7) ─────────────────────────────────────────────────────────
  # Visibility: conversations.read_all sees every conversation; with only
  # conversations.read, a caller sees conversations assigned to them or to
  # nobody. Invisible conversations answer 404 on every operation.
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: Conversations visible to the caller, most recent activity first
      description: >-
        Conversations the caller may see, most recent activity first. Filter by status, assignee
        (`me`, `unassigned` or a user ID), unread, phone number or a contact search. Paged with
        `cursor`.
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
        - { apiKey: [conversations.read] }
        - { apiKey: [conversations.read_all] }
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, closed] } }
        - name: assignee
          in: query
          description: "`me`, `unassigned` or a user ID."
          schema: { type: string, maxLength: 36 }
        - { name: unread, in: query, schema: { type: boolean }, description: Only conversations with unread customer messages. }
        - { name: phone_number_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Contact name or phone contains" }
        - name: ai
          in: query
          description: "`ai` — conversations the AI owns; `waiting_human` — escalated to a person and not taken yet."
          schema: { type: string, enum: [ai, waiting_human] }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: A conversation with its contact and 24-hour window
      description: >-
        One conversation with its contact, phone number, assignee and whether the 24-hour customer
        service window is open.
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
        - { apiKey: [conversations.read] }
        - { apiKey: [conversations.read_all] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/messages:
    get:
      operationId: listConversationMessages
      tags: [conversations]
      summary: Message history, newest first
      description: >-
        Messages of the conversation in both directions, newest first, with delivery state and
        media. Paged with `cursor`.
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
        - { apiKey: [conversations.read] }
        - { apiKey: [conversations.read_all] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessageListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: replyToConversation
      tags: [conversations]
      summary: Send a message in the conversation
      description: >-
        Queued like POST /messages, from the conversation's number. Free-form
        messages need an open 24-hour window (422 OUTSIDE_SERVICE_WINDOW
        otherwise; send an approved template instead); templates are refused
        to opted-out contacts (422 CONTACT_OPTED_OUT).
      security:
        - { session: [conversations.reply] }
        - { apiKey: [conversations.reply] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplyRequest" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/assignment:
    put:
      operationId: assignConversation
      tags: [conversations]
      summary: Assign the conversation to a user, or unassign it with null
      description: >-
        Assigns the conversation to a user, or unassigns it with `"assignee_id": null`. The
        assignee must be an active user who may work the inbox.
      security:
        - { session: [conversations.assign] }
        - { apiKey: [conversations.assign] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignConversationRequest" }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/close:
    post:
      operationId: closeConversation
      tags: [conversations]
      summary: Close the conversation; the next customer message reopens it
      description: >-
        Marks the conversation closed. The next message from the customer reopens it
        automatically.
      security:
        - { session: [conversations.assign] }
        - { apiKey: [conversations.assign] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/reopen:
    post:
      operationId: reopenConversation
      tags: [conversations]
      summary: Reopen a closed conversation
      description: >-
        Reopens a closed conversation without waiting for a customer message.
      security:
        - { session: [conversations.assign] }
        - { apiKey: [conversations.assign] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      tags: [conversations]
      summary: Mark the customer's messages as read for the team
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/events:
    get:
      operationId: listConversationEvents
      tags: [conversations]
      summary: Assignment and status history, newest first (last 100)
      description: >-
        Assignment and status changes of the conversation (assigned, closed, reopened, opt-out
        requests …), newest first, the last 100.
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
        - { apiKey: [conversations.read] }
        - { apiKey: [conversations.read_all] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationEventListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/media/{mediaId}:
    get:
      operationId: downloadConversationMedia
      tags: [conversations]
      summary: Download a stored media file of a message in the conversation
      description: >-
        Images, video and audio of common types are served inline, everything
        else as an attachment; always with X-Content-Type-Options nosniff and a
        sandboxing Content-Security-Policy. 409 MEDIA_NOT_STORED while the
        worker has not downloaded the file from Meta yet.
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
        - { apiKey: [conversations.read] }
        - { apiKey: [conversations.read_all] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/MediaId" }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  # ── Conversation intelligence and AI handoff (Phase 16C P6) ───────────────
  # Ownership: owner_type none | human | ai with ai_mode off | suggest (a
  # person or nobody owns the conversation) or auto_reply |
  # awaiting_approval (the AI owns it). See docs/AI.md, "Sohbet devri".
  /conversations/{conversationId}/ai-mode:
    put:
      operationId: setConversationAIMode
      tags: [conversations]
      summary: Set how the AI works in the conversation
      description: >-
        `auto_reply` and `awaiting_approval` hand the conversation to the AI
        (owner `ai`); `off` and `suggest` keep or give it to a person (owner
        `human`, or `none` when nobody owned it). Handing to the AI needs AI
        switched on for the company, an active AI profile on the
        conversation's number and AI allowed for the contact (409
        AI_UNAVAILABLE otherwise); `suggest` needs the same. When the
        customer's last message is still unanswered, the AI answers it right
        away. Recorded in the activity timeline and the audit log.
      security:
        - { session: [conversations.reply] }
        - { apiKey: [conversations.reply] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetConversationAIModeRequest" }
            example: { mode: auto_reply }
      responses:
        "200":
          description: The conversation with its new owner and mode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: AI_UNAVAILABLE — AI is off, the number has no active AI profile or AI is disabled for the contact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: { code: AI_UNAVAILABLE, message: "The number has no active AI profile.", details: [] }, meta: { request_id: "req_01" } }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/handoff:
    post:
      operationId: handOffConversation
      tags: [conversations]
      summary: Hand the conversation to the AI or to a person
      description: >-
        `to: ai` is the same as setting the AI mode (`mode`, default
        `auto_reply`). `to: human` takes it from the AI and gives it to
        `assignee_id`, or to the team's pool with null (the conversation is
        unassigned); giving it to someone else needs conversations.assign.
        A handoff record is written (reason `manual`), the new assignee is
        notified, and the change is recorded in the activity timeline and
        the audit log.
      security:
        - { session: [conversations.reply] }
        - { apiKey: [conversations.reply] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandoffRequest" }
            examples:
              toAI: { summary: Hand to the AI, value: { to: ai, mode: auto_reply } }
              toPool: { summary: Hand to the team's pool, value: { to: human, assignee_id: null, note: "Müşteri fatura itirazında." } }
      responses:
        "200":
          description: The conversation with its new owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/takeover:
    post:
      operationId: takeOverConversation
      tags: [conversations]
      summary: Take the conversation over from the AI or the pool
      description: >-
        The caller becomes the owner and assignee; a pending escalation is
        accepted. The AI keeps the mode the profile sets for a takeover
        (`off`, or `suggest`). Replying in a conversation the AI owns has
        the same effect.
      security:
        - { session: [conversations.reply] }
        - { apiKey: [conversations.reply] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200":
          description: The conversation, now owned by the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/handoffs:
    get:
      operationId: listConversationHandoffs
      tags: [conversations]
      summary: Owner changes and escalations, newest first (last 50)
      description: >-
        An escalation (from `ai`) carries the reason, a summary written by
        the AI (or built from the last messages when the AI failed), the
        customer's need, the suggested next action and the fields the AI
        collected. `accepted_at` is null while nobody took it.
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
        - { apiKey: [conversations.read] }
        - { apiKey: [conversations.read_all] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200":
          description: Handoffs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationHandoffListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/notes:
    get:
      operationId: listConversationNotes
      tags: [conversations]
      summary: Internal notes, newest first (last 100)
      description: Notes are internal to the team and never sent to the customer.
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
        - { apiKey: [conversations.read] }
        - { apiKey: [conversations.read_all] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationNoteListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createConversationNote
      tags: [conversations]
      summary: Add an internal note
      description: >-
        Never sent to the customer. With `for_ai`, the note is given to the
        AI as an instruction from the team in its next turns (never as
        customer content, and the AI is told never to quote it).
      security:
        - { session: [conversations.reply] }
        - { apiKey: [conversations.reply] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversationNoteRequest" }
            example: { body: "Müşteri VIP; kargo ücretini sorarsa ücretsiz olduğunu söyle.", for_ai: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationNoteResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/activity:
    get:
      operationId: listConversationActivity
      tags: [conversations]
      summary: The conversation's activity timeline, newest last
      description: >-
        One typed stream: handoffs, assignee changes, AI actions and replies,
        notes, automation runs, sent and failed messages and escalations.
        A page holds the latest items oldest first; `meta.next_cursor`
        fetches the page before it. New items are announced with
        `conversation.activity` on the conversation's realtime channel.
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
        - { apiKey: [conversations.read] }
        - { apiKey: [conversations.read_all] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationActivityListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/ai-drafts:
    get:
      operationId: listConversationAIDrafts
      tags: [conversations]
      summary: AI suggestions and replies waiting for approval, newest first
      description: >-
        Drafts the AI wrote for the conversation: suggestions (mode `suggest`)
        and replies held for approval (mode `awaiting_approval`), with their
        decision (accepted, edited, rejected) once someone decided. With
        `pending=true` only undecided drafts are returned.
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
        - { apiKey: [conversations.read] }
        - { apiKey: [conversations.read_all] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { name: pending, in: query, schema: { type: boolean }, description: Only drafts nobody decided on yet. }
      responses:
        "200":
          description: Drafts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIDraftListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/ai-drafts/{draftId}/accept:
    post:
      operationId: acceptConversationAIDraft
      tags: [conversations]
      summary: Send an AI draft, as written or edited
      description: >-
        Sends the draft through the normal send path (24-hour window and
        consent rules apply). With `body`, the edited text is sent and the
        draft is recorded as `edited`. A reply waiting for approval is sent
        as the AI's message; an accepted suggestion as the caller's.
      security:
        - { session: [conversations.reply] }
        - { apiKey: [conversations.reply] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/DraftId" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptAIDraftRequest" }
            example: { body: "Siparişiniz yarın kargoya veriliyor." }
      responses:
        "200":
          description: The decided draft with the message it sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIDraftResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: DRAFT_DECIDED — someone already decided on this draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/ai-drafts/{draftId}/reject:
    post:
      operationId: rejectConversationAIDraft
      tags: [conversations]
      summary: Discard an AI draft
      description: >-
        Marks the draft as rejected; nothing is sent to the customer. A draft
        somebody already decided on returns 409 DRAFT_DECIDED.
      security:
        - { session: [conversations.reply] }
        - { apiKey: [conversations.reply] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/DraftId" }
      responses:
        "200":
          description: The rejected draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIDraftResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/automation-runs:
    get:
      operationId: listConversationAutomationRuns
      tags: [conversations]
      summary: Automation runs of the conversation, newest first (last 50)
      description: >-
        Runs started by a trigger, a person or the AI for this conversation,
        with their progress. Changes are announced with
        `automation.run.updated` on the conversation's realtime channel.
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
        - { apiKey: [conversations.read] }
        - { apiKey: [conversations.read_all] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationAutomationRunListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  # ── Automations (Phase 8) ────────────────────────────────────────────────
  /automations:
    get:
      operationId: listAutomations
      tags: [automations]
      summary: Automations with run counts
      description: >-
        All automations with their trigger, steps and how often they ran. Automations are built in
        the panel; the API reads them, for example to show an integration which flows are active.
      security: [{ session: [automations.read] }, { apiKey: [automations.read] }]
      responses:
        "200":
          description: Automations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAutomation
      tags: [automations]
      summary: Create an automation (inactive until enabled)
      security: [{ session: [automations.manage] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAutomationRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationResponse" }
        default: { $ref: "#/components/responses/Error" }

  /automations/{automationId}:
    get:
      operationId: getAutomation
      tags: [automations]
      summary: An automation
      description: >-
        One automation with its trigger options, steps (each with a stable id) and canvas layout.
      security: [{ session: [automations.read] }, { apiKey: [automations.read] }]
      parameters:
        - { $ref: "#/components/parameters/AutomationId" }
      responses:
        "200":
          description: Automation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAutomation
      tags: [automations]
      summary: Edit or enable/disable an automation
      description: Changing the trigger or steps cancels runs that are still in progress.
      security: [{ session: [automations.manage] }]
      parameters:
        - { $ref: "#/components/parameters/AutomationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAutomationRequest" }
      responses:
        "200":
          description: Automation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAutomation
      tags: [automations]
      summary: Delete an automation and its run history
      security: [{ session: [automations.manage] }]
      parameters:
        - { $ref: "#/components/parameters/AutomationId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /automations/{automationId}/runs:
    get:
      operationId: listAutomationRuns
      tags: [automations]
      summary: Execution log, newest first
      security: [{ session: [automations.read] }]
      parameters:
        - { $ref: "#/components/parameters/AutomationId" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRunListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /automation-runs/{runId}:
    get:
      operationId: getAutomationRun
      tags: [automations]
      summary: A run with every executed step
      security: [{ session: [automations.read] }]
      parameters:
        - { $ref: "#/components/parameters/RunId" }
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRunResponse" }
        default: { $ref: "#/components/responses/Error" }

  # ── Outgoing webhooks (Phase 8) ─────────────────────────────────────────────
  # Receivers integrators register. Payloads, signatures and the retry policy
  # are documented in docs/WEBHOOKS.md.
  /webhook-event-types:
    get:
      operationId: listWebhookEventTypes
      tags: [webhooks]
      summary: Event types an endpoint can subscribe to
      description: >-
        Every event type an endpoint can subscribe to, with a short description. See the webhooks
        guide for the payload of each.
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      responses:
        "200":
          description: Event catalogue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEventTypeListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /webhook-endpoints:
    get:
      operationId: listWebhookEndpoints
      tags: [webhooks]
      summary: Registered endpoints, newest first
      description: >-
        Registered webhook endpoints with their event types and status, newest first. Secrets are
        never returned here.
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      responses:
        "200":
          description: Endpoints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createWebhookEndpoint
      tags: [webhooks]
      summary: Register an endpoint; the signing secret is returned once
      description: >-
        The URL must be https and must resolve to a public address (422
        otherwise). The signing secret is generated by Messora and only shown
        in this response and after rotation.
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookEndpointRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointSecretResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /webhook-endpoints/{endpointId}:
    get:
      operationId: getWebhookEndpoint
      tags: [webhooks]
      summary: One endpoint
      description: >-
        One webhook endpoint; the signing secret is not included (only its last four characters).
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/EndpointId" }
      responses:
        "200":
          description: Endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateWebhookEndpoint
      tags: [webhooks]
      summary: Change the URL, description, events or active flag
      description: Re-activating an endpoint clears its `disabled_reason`.
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/EndpointId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWebhookEndpointRequest" }
      responses:
        "200":
          description: Endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWebhookEndpoint
      tags: [webhooks]
      summary: Delete an endpoint and its delivery log
      description: >-
        Deletes the endpoint and its delivery log. Pending deliveries are dropped.
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/EndpointId" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /webhook-endpoints/{endpointId}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      tags: [webhooks]
      summary: Replace the signing secret; the new one is returned once
      description: The old secret stops working immediately, including for retries of earlier events.
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/EndpointId" }
      responses:
        "200":
          description: Endpoint and its new secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointSecretResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /webhook-endpoints/{endpointId}/test:
    post:
      operationId: sendWebhookTest
      tags: [webhooks]
      summary: Queue a `webhook.test` event for this endpoint only
      description: Also works for an inactive endpoint, so a receiver can be checked before it is switched back on.
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/EndpointId" }
      responses:
        "201":
          description: The queued delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /webhook-endpoints/{endpointId}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: Delivery log of an endpoint, newest first
      description: >-
        Deliveries to the endpoint, newest first, with attempts, the last HTTP status, duration,
        error and the start of the receiver's answer. Filter with `status`; paged with `cursor`.
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/EndpointId" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/WebhookDeliveryStatus" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /webhook-deliveries/{deliveryId}/redeliver:
    post:
      operationId: redeliverWebhook
      tags: [webhooks]
      summary: Send a delivery again with a fresh retry budget
      description: >-
        The receiver gets the same event (same `Messora-Event-Id`) with a new
        signature. 409 DELIVERY_IN_PROGRESS while a request is in flight.
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/DeliveryId" }
      responses:
        "200":
          description: The re-queued delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    panel:
      type: apiKey
      in: header
      name: X-Messora-BFF
      description: Shared secret of the panel; only present on the internal network.
    session:
      type: http
      scheme: bearer
      description: Opaque panel session token, accepted only together with the panel secret.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: msk_live_…

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PriceId:
      name: priceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhoneNumberId:
      name: phoneNumberId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OfferId:
      name: offerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NoteId:
      name: noteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SegmentId:
      name: segmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AutomationId:
      name: automationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EndpointId:
      name: endpointId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `meta.next_cursor`.
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    QueuePath:
      name: queue
      in: path
      required: true
      schema: { $ref: "#/components/schemas/QueueName" }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Retry-safe POST: a repeated request with the same key replays the first
        successful response for 24 hours. Rejected requests (4xx/5xx) are not
        remembered, so a corrected request may reuse the key.
      schema: { type: string, minLength: 8, maxLength: 200 }

  headers:
    RateLimit-Limit:
      description: Requests allowed in a burst (the per-minute budget of the caller).
      schema: { type: integer, example: 300 }
    RateLimit-Remaining:
      description: Requests the caller can still make right now.
      schema: { type: integer, example: 287 }
    RateLimit-Reset:
      description: Seconds until the full budget is available again.
      schema: { type: integer, example: 3 }
    RateLimit-Policy:
      description: 'The quota policy: `<limit>;w=<window seconds>`.'
      schema: { type: string, example: "300;w=60" }
    Retry-After:
      description: Seconds to wait before the next request is allowed.
      schema: { type: integer, example: 1 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Missing, invalid, expired or revoked credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: {"error": {"code": "UNAUTHORIZED", "message": "Authentication required", "details": []}, "meta": {"request_id": "019a8c2e-4f1b-7fff-9c3d-5e7a1000ffff"}}
    Forbidden:
      description: The credentials lack the required scope (or cannot be used for this operation).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: {"error": {"code": "FORBIDDEN", "message": "Missing permission: contacts.read", "details": []}, "meta": {"request_id": "019a8c2e-4f1b-7fff-9c3d-5e7a1000ffff"}}
    NotFound:
      description: The resource does not exist (or is not visible to the caller).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: {"error": {"code": "NOT_FOUND", "message": "Contact not found", "details": []}, "meta": {"request_id": "019a8c2e-4f1b-7fff-9c3d-5e7a1000ffff"}}
    Conflict:
      description: The request conflicts with the current state (e.g. a duplicate, a campaign in the wrong status, or an Idempotency-Key reused with a different body).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: {"error": {"code": "IDEMPOTENCY_KEY_REUSED", "message": "This Idempotency-Key was used with a different request", "details": []}, "meta": {"request_id": "019a8c2e-4f1b-7fff-9c3d-5e7a1000ffff"}}
    ValidationFailed:
      description: The request does not match the schema or a business rule; `details` names the fields.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: {"error": {"code": "VALIDATION_ERROR", "message": "Invalid request", "details": [{"field": "to", "code": "invalid", "message": "must be in E.164 format"}]}, "meta": {"request_id": "019a8c2e-4f1b-7fff-9c3d-5e7a1000ffff"}}
    RateLimited:
      description: Too many requests; the per-key budget is used up. Wait `Retry-After` seconds.
      headers:
        Retry-After: { $ref: "#/components/headers/Retry-After" }
        RateLimit-Limit: { $ref: "#/components/headers/RateLimit-Limit" }
        RateLimit-Remaining: { $ref: "#/components/headers/RateLimit-Remaining" }
        RateLimit-Reset: { $ref: "#/components/headers/RateLimit-Reset" }
        RateLimit-Policy: { $ref: "#/components/headers/RateLimit-Policy" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: {"error": {"code": "RATE_LIMITED", "message": "Too many requests", "details": []}, "meta": {"request_id": "019a8c2e-4f1b-7fff-9c3d-5e7a1000ffff"}}

  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }
        next_cursor: { type: string }
        total: { type: integer, format: int64, description: "Matching items, for paged lists." }

    ErrorDetail:
      type: object
      required: [code]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }

    ErrorBody:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          examples: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, REAUTH_REQUIRED, INTERNAL_ERROR]
        message: { type: string }
        details:
          type: array
          items: { $ref: "#/components/schemas/ErrorDetail" }

    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }
        meta: { $ref: "#/components/schemas/Meta" }

    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 254

    Password:
      type: string
      minLength: 12
      maxLength: 256
      description: At least 12 characters. Common passwords are rejected.

    PersonName:
      type: string
      minLength: 1
      maxLength: 120

    RoleKey:
      type: string
      enum: [owner, admin, manager, agent]

    Permission:
      type: string
      pattern: '^[a-z_]+\.[a-z_]+$'

    RoleRef:
      type: object
      required: [key, name]
      properties:
        key: { $ref: "#/components/schemas/RoleKey" }
        name: { type: string }

    User:
      type: object
      required: [id, email, name, status, role, mfa_enabled, locale, timezone, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, disabled] }
        role: { $ref: "#/components/schemas/RoleRef" }
        mfa_enabled: { type: boolean }
        locale: { type: string }
        timezone: { type: string }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    SessionInfo:
      type: object
      required: [id, created_at, last_seen_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }

    Me:
      type: object
      required: [user, permissions, session, mfa_required]
      properties:
        user: { $ref: "#/components/schemas/User" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        session:
          type: object
          required: [id, expires_at]
          properties:
            id: { type: string, format: uuid }
            expires_at: { type: string, format: date-time }
            reauth_valid_until: { type: [string, "null"], format: date-time }
        mfa_required:
          type: boolean
          description: The user's role requires two-factor authentication but it is not enabled yet.

    SessionCreated:
      type: object
      required: [session_token, expires_at, user]
      properties:
        session_token:
          type: string
          description: Opaque token. The panel stores it in an HttpOnly cookie; never expose it to browsers.
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    SetupStatus:
      type: object
      required: [setup_required]
      properties:
        setup_required: { type: boolean }

    CompleteSetupRequest:
      type: object
      additionalProperties: false
      required: [token, name, email, password]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
        name: { $ref: "#/components/schemas/PersonName" }
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/Password" }
        organization_name: { type: string, minLength: 1, maxLength: 120 }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 1, maxLength: 256 }

    LoginResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [authenticated, mfa_required] }
        session: { $ref: "#/components/schemas/SessionCreated" }
        mfa_token:
          type: string
          description: Present when status is mfa_required; valid for 5 minutes.

    LoginMfaRequest:
      type: object
      additionalProperties: false
