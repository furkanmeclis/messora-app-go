    SegmentDefinition:
      type: object
      description: >-
        A group {"op":"and"|"or","not"?:bool,"rules":[...]} or a rule
        {"field":..., "operator":..., "value":...}. Fields: name, profile_name,
        phone, email, var1–var5, created_at, last_inbound_at, opted_out, tag, group.
      additionalProperties: true

    Segment:
      example:
        id: 019a8c2e-4f1b-7a05-9c3d-5e7a10000005
        name: Active VIPs
        description: VIP customers who wrote in the last 90 days
        definition:
          op: and
          rules:
            - {field: tag, operator: has, value: vip}
            - {field: last_inbound_at, operator: within_days, value: 90}
        contact_count: 4200
        created_at: "2026-10-01T09:00:00Z"
        updated_at: "2026-11-10T14:00:00Z"
      type: object
      required: [id, name, description, definition, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        definition: { $ref: "#/components/schemas/SegmentDefinition" }
        contact_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SegmentInput:
      type: object
      additionalProperties: false
      required: [name, definition]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        definition: { $ref: "#/components/schemas/SegmentDefinition" }

    UpdateSegmentRequest:
