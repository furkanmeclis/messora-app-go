          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 200 }
        phone_number_id: { type: string, format: uuid }
        tag: { type: string, maxLength: 60 }
        status: { type: string, enum: [delivered, read, failed] }
        campaign_id: { type: string, format: uuid }
        subscription:
          type: string
          enum: [stop, request, resume]
          description: "subscription_request: only this kind (stop word, opt-out request phrase, resubscribe word); omitted = any."
        cooldown_seconds: { type: integer, minimum: 0, maximum: 7776000 }

    AutomationStep:
      type: object
      description: >-
        One step: reply, send_template, add_tag, remove_tag, add_to_group, set_field,
        condition (with if/then/else), http_request, send_email, delay, assign,
        close_conversation, mute. Text values accept placeholders such as {{name}},
        {{first_name}}, {{var1}} and {{message}}. See docs/AUTOMATIONS.md.
      required: [type]
      additionalProperties: true
      properties:
        type: { type: string }
        id:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          description: >-
            Stable id of the step (unique within the automation; "trigger" is
            reserved). Optional: the server assigns one to steps without it.
            The canvas layout and run traces refer to steps by this id.

    AutomationPoint:
      type: object
      required: [x, y]
      additionalProperties: false
      properties:
        x: { type: number, format: double, minimum: -1000000, maximum: 1000000 }
        y: { type: number, format: double, minimum: -1000000, maximum: 1000000 }

    AutomationLayout:
      type: object
      description: >-
        Canvas positions of the editor's nodes by step id ("trigger" for the
        trigger node). Positions of unknown ids are dropped on save.
      maxProperties: 200
      additionalProperties: { $ref: "#/components/schemas/AutomationPoint" }

