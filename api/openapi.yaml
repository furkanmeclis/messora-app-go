        models: { type: integer, description: Models now in the catalogue for this provider. }
    AIModelSyncResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/AIModelSync" }, meta: { $ref: "#/components/schemas/Meta" } }

    AICapabilities:
      type: object
      required: [tools, structured_output, vision, thinking]
