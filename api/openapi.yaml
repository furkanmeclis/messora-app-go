        id: { type: string, format: uuid }
        name: { type: string }
        waba_id: { type: string }
        app_id: { type: [string, "null"] }
        status: { type: string, enum: [active, error, disabled] }
        last_error: { type: [string, "null"] }
        app_secret_configured: { type: boolean }
        last_synced_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    ConnectWhatsAppAccountRequest:
      type: object
      additionalProperties: false
      required: [name, waba_id, access_token]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        waba_id: { type: string, pattern: "^[0-9]{1,32}$" }
        app_id: { type: string, pattern: "^[0-9]{1,32}$" }
        access_token: { type: string, minLength: 20, maxLength: 1024, writeOnly: true }
        app_secret: { type: string, minLength: 8, maxLength: 256, writeOnly: true }

    UpdateWhatsAppAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        access_token: { type: string, minLength: 20, maxLength: 1024, writeOnly: true }
        app_secret: { type: string, minLength: 8, maxLength: 256, writeOnly: true }
        status: { type: string, enum: [active, disabled] }

    SyncResult:
      type: object
      required: [phone_numbers, templates]
      properties:
        phone_numbers: { type: integer }
        templates: { type: integer }

    PhoneNumber:
      type: object
      required: [id, account_id, account_name, phone_number_id, display_phone_number, verified_name, quality_rating, messaging_limit, is_default]
      properties:
