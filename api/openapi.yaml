        meta: { $ref: "#/components/schemas/Meta" }

    AIRates:
      type: object
      description: Per-1M prices as decimal strings; a missing rate keeps the row's.
      properties:
        input: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
        cached_input: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
        cache_write_5m: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
        cache_write_1h: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
        output: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }

    AIPriceThreshold:
      allOf:
        - $ref: "#/components/schemas/AIRates"
        - type: object
          required: [input_tokens_over]
          properties:
            input_tokens_over: { type: integer, format: int64, minimum: 1, description: Applies when total input tokens exceed this. }

    AIPriceWindow:
      allOf:
        - $ref: "#/components/schemas/AIRates"
        - type: object
          required: [start, end]
          properties:
            label: { type: string }
            weekdays: { type: array, items: { type: integer, minimum: 1, maximum: 7 }, description: ISO weekdays (1 = Monday); empty = every day. }
            start: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
            end: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", description: Exclusive; may wrap past midnight. }
            time_zone: { type: string, description: "IANA zone, default UTC." }
            multiplier: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }

    AIPriceRules:
      type: object
      properties:
        thresholds: { type: array, items: { $ref: "#/components/schemas/AIPriceThreshold" } }
        windows: { type: array, items: { $ref: "#/components/schemas/AIPriceWindow" } }

    AIPrice:
      type: object
      required: [id, provider_kind, model_pattern, currency, input, cached_input, cache_write_5m, cache_write_1h, output, rules,
        effective_from, effective_to, source, source_url, notes, confirmed, confirmed_at, confirmed_by, updated_at]
      properties:
        id: { type: string, format: uuid }
        provider_kind: { $ref: "#/components/schemas/AIProviderKind" }
        model_pattern: { type: string, description: "A model id, or a prefix ending in '*'." }
        currency: { type: string }
        input: { type: string, description: Per 1M input tokens. }
        cached_input: { type: [string, "null"], description: Per 1M cached (cache read) input tokens. }
        cache_write_5m: { type: [string, "null"], description: Per 1M tokens written to the cache (5-minute cache). }
        cache_write_1h: { type: [string, "null"], description: Per 1M tokens written to the 1-hour cache (Anthropic). }
        output: { type: string, description: Per 1M output tokens (reasoning included). }
        rules: { $ref: "#/components/schemas/AIPriceRules" }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, "null"], format: date, description: Exclusive. }
        source: { type: string, enum: [seed, litellm, manual] }
        source_url: { type: string }
        notes: { type: string }
        confirmed: { type: boolean }
        confirmed_at: { type: [string, "null"], format: date-time }
        confirmed_by: { type: [string, "null"], format: uuid }
        updated_at: { type: string, format: date-time }

    CreateAIPriceRequest:
      type: object
      additionalProperties: false
      required: [provider_kind, model_pattern, input, output, effective_from]
      properties:
        provider_kind: { $ref: "#/components/schemas/AIProviderKind" }
