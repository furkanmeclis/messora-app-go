        ai_disabled: { type: boolean }
    ContactAISettingResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/ContactAISetting" }, meta: { $ref: "#/components/schemas/Meta" } }

    # ── Realtime (Phase 6) ──────────────────────────────────────────────────
    RealtimeSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [channel]
      properties:
        channel: { type: string, minLength: 3, maxLength: 128, description: "Channel name, e.g. inbox:all or campaign:<id>." }
    RealtimeToken:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string, description: Centrifugo JWT. }
        expires_at: { type: string, format: date-time }
    RealtimeTokenResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/RealtimeToken" }, meta: { $ref: "#/components/schemas/Meta" } }

    RealtimeEvent:
      type: object
      description: >-
        A realtime event: the envelope below plus the fields of its type
        (see docs/ARCHITECTURE.md, realtime).
      required: [type, v, id, ts]
      additionalProperties: true
      properties:
        type: { type: string, description: "<area>.<event>, e.g. conversation.updated." }
        v: { type: integer }
        id: { type: string, format: uuid, description: Unique event ID; copies on several channels share it. }
        ts: { type: string, format: date-time }
    RealtimeSync:
      type: object
      required: [events, has_more]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/RealtimeEvent" } }
        has_more: { type: boolean, description: More changed than returned; reload instead. }
    RealtimeSyncResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/RealtimeSync" }, meta: { $ref: "#/components/schemas/Meta" } }

    # ── Campaigns (Phase 5) ────────────────────────────────────────────────
    CampaignStatus:
      type: string
      enum: [draft, scheduled, preparing, running, paused, paused_limit, completed, cancelled, failed]
      description: paused_limit waits for the portfolio messaging limit and resumes by itself; other pauses are paused.

    CampaignAudience:
      type: object
      additionalProperties: false
      description: Exactly one of the properties.
      minProperties: 1
      maxProperties: 1
      properties:
        segment_id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        tag_id: { type: string, format: uuid }
        all: { type: boolean, enum: [true] }
        previous_campaign:
          type: object
          additionalProperties: false
          description: >-
            Customers a finished campaign did not reach, for the chosen
            reasons; computed when the new campaign starts, one recipient per
            contact, consent checked again. user_stopped_marketing and
            blocked_by_consent cannot be chosen (hard blocks).
          required: [campaign_id, classes]
          properties:
            campaign_id: { type: string, format: uuid }
            classes:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, enum: [temporary, rejected_by_meta, ecosystem_limit, undeliverable, permanent, never_sent] }
        contact_ids:
          type: array
          minItems: 1
          maxItems: 50000
          description: An explicit list of contacts (e.g. a follow-up to a selection of another campaign's recipients).
          items: { type: string, format: uuid }

    CampaignParams:
      type: object
      additionalProperties: false
      description: >-
        Template variables. Values may contain {{name}}, {{first_name}}, {{phone}},
        {{email}}, {{var1}}–{{var5}} and {{attr:<key>}}. Use a list for positional
        templates and an object for named parameters.
      properties:
        header:
          oneOf:
            - { type: array, maxItems: 10, items: { type: string, maxLength: 1024 } }
            - { type: object, maxProperties: 10, additionalProperties: { type: string, maxLength: 1024 } }
        body:
          oneOf:
            - { type: array, maxItems: 20, items: { type: string, maxLength: 1024 } }
            - { type: object, maxProperties: 20, additionalProperties: { type: string, maxLength: 1024 } }
        buttons:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 2000 }
        fallback:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 1024 }
        header_media: { $ref: "#/components/schemas/TemplateHeaderMedia" }
        location:
          type: object
          additionalProperties: false
          description: The place of a location header, in decimal degrees; name and address may contain placeholders.
          required: [latitude, longitude]
          properties:
            latitude: { type: string, maxLength: 32 }
            longitude: { type: string, maxLength: 32 }
            name: { type: string, maxLength: 1024 }
            address: { type: string, maxLength: 1024 }
        coupon_code:
          type: string
          maxLength: 1024
          description: Code of the copy code button (placeholders allowed). A campaign linked to an offer takes the offer's coupon when empty.
        expiration_time_ms:
          type: integer
          format: int64
          minimum: 1
          description: When a limited-time offer ends (Unix milliseconds). A campaign linked to an offer always takes the offer's end.
        cards:
          type: array
          maxItems: 10
          description: Carousel cards in order (as many as the template defines).
          items:
            type: object
            additionalProperties: false
            properties:
              header_media: { $ref: "#/components/schemas/TemplateHeaderMedia" }
              body:
                oneOf:
                  - { type: array, maxItems: 20, items: { type: string, maxLength: 1024 } }
                  - { type: object, maxProperties: 20, additionalProperties: { type: string, maxLength: 1024 } }
              buttons:
                type: array
                maxItems: 2
                items: { type: string, maxLength: 2000 }
        otp_code:
          type: string
          maxLength: 1024
          description: The one-time password of an authentication template (the body and the button take it).
        flow:
          type: object
          additionalProperties: false
          description: Values for a Flow button.
          properties:
            flow_token: { type: string, maxLength: 1024, description: Identifies the session to your Flow endpoint; Meta's default is unused. }
            flow_action_data: { type: object, additionalProperties: true, description: Data for the Flow's first screen. }

    TemplateHeaderMedia:
      type: object
      additionalProperties: false
      description: Media for an image, video or document header (exactly one of id or https link).
      required: [type]
      properties:
        type: { type: string, enum: [image, video, document] }
        id: { type: string, maxLength: 200 }
        link: { type: string, format: uri, maxLength: 2000 }
        filename: { type: string, maxLength: 240 }

    Campaign:
      example:
        id: 019a8c2e-4f1b-7a03-9c3d-5e7a10000003
        name: Winter sale
        status: running
        phone_number_id: 019a8c2e-4f1b-7a04-9c3d-5e7a10000004
        template_name: winter_sale
        template_language: tr
        template_params: {body: ["{{first_name}}", "25%"]}
        audience: {segment_id: 019a8c2e-4f1b-7a05-9c3d-5e7a10000005}
        window_size: 0
        total_recipients: 4200
        counts: {recipients_pending: 1800, recipients_skipped: 35, sent: 2365, delivered: 2290,
          read: 1410, failed: 12}
        scheduled_at: null
        started_at: "2026-11-25T09:00:00Z"
        finished_at: null
        last_error: null
        offer_id: null
        priority: normal
        max_mps: null
        paused_reason: null
        paused_at: null
        paused_by: null
        resume_at: null
        send_rate: 18.5
        eta_seconds: 97
        created_at: "2026-11-24T15:20:00Z"
        updated_at: "2026-11-25T09:00:00Z"
      type: object
      required: [id, name, status, phone_number_id, template_name, template_language, template_params, audience,
                 window_size, total_recipients, counts, priority, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: "#/components/schemas/CampaignStatus" }
        phone_number_id: { type: string, format: uuid }
        template_name: { type: string }
        template_language: { type: string }
        template_params: { $ref: "#/components/schemas/CampaignParams" }
        audience: { $ref: "#/components/schemas/CampaignAudience" }
        window_size: { type: integer, description: Messages in flight at once; 0 means automatic. }
        total_recipients: { type: integer, format: int64 }
        counts:
          type: object
          description: >-
            Recipients by state (recipients_pending, recipients_skipped …), messages by status (sent, delivered, read,
            failed, unknown, held …) and the analytics counters (a_sent, a_delivered, a_read, a_failed, a_pending,
            a_blocked, a_rejected, a_replied, a_positive, a_negative, a_neutral, a_opted_out, a_err_131048/131049/131050,
            a_priced, a_unpriced, a_cost_micros). Read from incremental counters, not counted per request.
          additionalProperties: { type: integer, format: int64 }
        scheduled_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        offer_id: { type: [string, "null"], format: uuid, description: The offer the campaign promotes (see Offer). }
        priority: { $ref: "#/components/schemas/CampaignPriority" }
        max_mps: { type: [number, "null"], format: double, description: Rate cap in messages per second; null = its fair share. }
        paused_reason: { type: [string, "null"], description: "Why it is paused: manual, messaging_limit, offer_expired, license_restricted …" }
        paused_at: { type: [string, "null"], format: date-time }
        paused_by: { type: [string, "null"], format: uuid }
        resume_at: { type: [string, "null"], format: date-time, description: "When it resumes by itself (limit frees up, or a scheduled resume)." }
        send_rate: { type: [number, "null"], format: double, description: Measured rate in messages per second. }
        eta_seconds: { type: [integer, "null"], format: int64, description: Estimated time left at the measured rate. }
        reaction_map: { $ref: "#/components/schemas/ReactionMap" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateCampaignRequest:
      example:
        name: Winter sale
        template_name: winter_sale
        template_language: tr
        template_params: {body: ["{{first_name}}", "25%"]}
        audience: {segment_id: 019a8c2e-4f1b-7a05-9c3d-5e7a10000005}
      type: object
      additionalProperties: false
      required: [name, template_name, template_language, audience]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone_number_id: { type: string, format: uuid }
        template_name: { type: string, minLength: 1, maxLength: 512 }
        template_language: { type: string, minLength: 2, maxLength: 15 }
        template_params: { $ref: "#/components/schemas/CampaignParams" }
        audience: { $ref: "#/components/schemas/CampaignAudience" }
        window_size: { type: integer, minimum: 0, maximum: 10000 }
        offer_id:
          type: string
          format: uuid
          description: >-
            Link an offer. A limited-time offer template takes its end as
            expiration_time_ms and its coupon; other templates can use the
            placeholders offer_title, offer_discount, offer_coupon,
            offer_ends, offer_url, offer_product and offer_description
            (e.g. {{offer_title}}). Starting or resuming is refused once the
            offer ended; a running campaign pauses with reason offer_expired.
        priority: { $ref: "#/components/schemas/CampaignPriority" }
        max_mps: { type: number, format: double, exclusiveMinimum: 0, maximum: 1000, description: Rate cap in messages per second. }
        reaction_map: { $ref: "#/components/schemas/ReactionMap" }

    UpdateCampaignRequest:
      example:
        name: Winter sale (final week)
        audience: {tag_id: 019a8c2e-4f1b-7a0c-9c3d-5e7a1000000c}
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone_number_id: { type: string, format: uuid }
        template_name: { type: string, minLength: 1, maxLength: 512 }
        template_language: { type: string, minLength: 2, maxLength: 15 }
        template_params: { $ref: "#/components/schemas/CampaignParams" }
        audience: { $ref: "#/components/schemas/CampaignAudience" }
        window_size: { type: integer, minimum: 0, maximum: 10000 }
        offer_id: { type: string, format: uuid, description: Link an offer (see CreateCampaignRequest). }
        clear_offer: { type: boolean, description: Unlink the offer. }
        priority: { $ref: "#/components/schemas/CampaignPriority" }
        max_mps: { type: number, format: double, exclusiveMinimum: 0, maximum: 1000 }
        clear_max_mps: { type: boolean }
        reaction_map: { $ref: "#/components/schemas/ReactionMap" }

    CampaignEventItem:
      example:
        id: 019a8c2e-4f1b-7a06-9c3d-5e7a10000006
        kind: paused
        detail: {reason: manual}
        actor_id: 019a8c2e-4f1b-7a07-9c3d-5e7a10000007
        created_at: "2026-11-25T09:20:00Z"
      type: object
      required: [id, kind, detail, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        detail: { type: object, additionalProperties: true }
        actor_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    CampaignRecipient:
      example:
        id: 019a8c2e-4f1b-7a08-9c3d-5e7a10000008
        contact_id: 019a8c2e-4f1b-7a09-9c3d-5e7a10000009
        phone: "+905321234567"
        state: queued
        skip_reason: null
        message_id: 019a8c2e-4f1b-7a0a-9c3d-5e7a1000000a
        message_status: delivered
        error_code: null
        error_title: null
        failure_class: null
      type: object
      required: [id, phone, state]
      properties:
        id: { type: string, format: uuid }
        contact_id: { type: [string, "null"], format: uuid }
        phone: { type: string }
        state: { type: string, enum: [pending, queued, skipped, cancelled] }
        skip_reason: { type: [string, "null"] }
        message_id: { type: [string, "null"], format: uuid }
        message_status: { type: [string, "null"] }
        error_code: { type: [string, "null"] }
        error_title: { type: [string, "null"] }
        failure_class: { $ref: "#/components/schemas/FailureClass" }
        outcome:
          type: string
          enum: [pending, retry_scheduled, in_flight, deferred, sent, delivered, read, unknown, failed, skipped, cancelled]
          description: Recipient state and message status combined.
        unreached_class:
          type: [string, "null"]
          enum: [temporary, rejected_by_meta, ecosystem_limit, undeliverable, permanent, never_sent, user_stopped_marketing, blocked_by_consent, null]
          description: Why the recipient was not reached (see UnreachedClass); null = reached or still in progress.
        resends: { type: integer, description: New messages sent after Meta withheld an accepted one (131049). }
        next_attempt_at: { type: [string, "null"], format: date-time, description: When a withheld recipient gets its new message. }

    CampaignPreflightRequest:
      example:
        audience: {segment_id: 019a8c2e-4f1b-7a05-9c3d-5e7a10000005}
        template_name: winter_sale
        template_language: tr
      type: object
      additionalProperties: false
      required: [audience, template_name, template_language]
      properties:
        audience: { $ref: "#/components/schemas/CampaignAudience" }
        phone_number_id: { type: string, format: uuid, description: The sending number; the default one when omitted. }
        template_name: { type: string }
        template_language: { type: string }

    PreflightReason:
      type: object
      required: [reason, count, hard]
      properties:
        reason:
          type: string
          enum: [opted_out, meta_marketing_stopped, undeliverable, opt_out_requested, consent_unknown, replied_after_opt_out]
        count: { type: integer, format: int64 }
        hard: { type: boolean, description: A hard block cannot be overridden by any setting. }

    CampaignPreflight:
      example:
        category: marketing
        unknown_marketing: allow
        total: 4200
        eligible: 4165
        warned: 610
        blocked: 35
        hard_blocked: 35
        blocked_reasons: [{reason: opted_out, count: 30, hard: true}, {reason: undeliverable,
            count: 5, hard: true}]
        warned_reasons: [{reason: consent_unknown, count: 610, hard: false}]
      type: object
      required: [category, unknown_marketing, total, eligible, warned, blocked, hard_blocked, blocked_reasons, warned_reasons]
      properties:
        category: { type: string, enum: [marketing, utility, authentication], description: From the template. }
        unknown_marketing: { type: string, enum: [allow, block], description: The company's current policy for unknown consent. }
        total: { type: integer, format: int64 }
        eligible: { type: integer, format: int64, description: Will be sent (including warned). }
        warned: { type: integer, format: int64 }
        blocked: { type: integer, format: int64 }
        hard_blocked: { type: integer, format: int64 }
        blocked_reasons: { type: array, items: { $ref: "#/components/schemas/PreflightReason" } }
        warned_reasons: { type: array, items: { $ref: "#/components/schemas/PreflightReason" } }
        by_failure_class:
          type: object
          description: >-
            For a previous_campaign audience: the source campaign's customers by
            why they were not reached (all classes, including those that cannot
            be selected, and "reached").
          additionalProperties: { type: integer, format: int64 }

    CampaignPreflightResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/CampaignPreflight" }, meta: { $ref: "#/components/schemas/Meta" } }

    UnreachedClass:
      type: string
      enum: [temporary, rejected_by_meta, ecosystem_limit, undeliverable, permanent, never_sent, user_stopped_marketing, blocked_by_consent]
      description: >-
        Why a campaign recipient was not reached: temporary (gave up after
        temporary errors), rejected_by_meta, ecosystem_limit (131049),
        undeliverable (131026), permanent (account, payload or missing
        variables), never_sent (cancelled or never queued),
        user_stopped_marketing (131050, hard block) and blocked_by_consent
        (hard block).

    CampaignPriority:
      type: string
      enum: [high, normal, low]
      description: Weight in the number's send scheduler (high 4, normal 2, low 1).

    CampaignSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        priority: { $ref: "#/components/schemas/CampaignPriority" }
        max_mps: { type: number, format: double, exclusiveMinimum: 0, maximum: 1000, description: Messages per second this campaign may use at most. }
        clear_max_mps: { type: boolean, description: Remove the rate cap. }
      example: { priority: high, max_mps: 20 }

    CampaignResumeRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        priority: { $ref: "#/components/schemas/CampaignPriority" }
        max_mps: { type: number, format: double, exclusiveMinimum: 0, maximum: 1000 }
        clear_max_mps: { type: boolean }
        resume_at: { type: string, format: date-time, description: Resume later instead of now; the campaign stays paused until then. }
      example: { priority: high, clear_max_mps: true, resume_at: "2026-11-26T08:00:00Z" }

    CampaignPause:
      type: object
      required: [id, status, reason, detail, paused_at, snapshot]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/CampaignStatus" }
        reason:
          type: string
          description: manual, system, messaging_limit, license_restricted, offer_expired, or a later automatic reason.
        detail: { type: object, additionalProperties: true }
        paused_at: { type: string, format: date-time }
        paused_by: { type: [string, "null"], format: uuid }
        resume_at: { type: [string, "null"], format: date-time }
        snapshot:
          type: object
          description: Counts at the pause — recipients by state (recipients_*), messages by status, recipients by unreached class (class_*).
          additionalProperties: { type: integer, format: int64 }
        resumed_at: { type: [string, "null"], format: date-time }
        resumed_by: { type: [string, "null"], format: uuid }
        changes: { type: [object, "null"], additionalProperties: true, description: What was changed when resuming. }
      example:
        id: 019a8c2e-4f1b-7a06-9c3d-5e7a10000006
        status: paused
        reason: manual
        detail: {}
        paused_at: "2026-11-25T10:15:00Z"
        paused_by: 019a8c2e-4f1b-7a01-9c3d-5e7a10000001
        resume_at: null
        snapshot: {recipients_pending: 1800, recipients_skipped: 35, sent: 2365, delivered: 2290, read: 1410,
          failed: 12, class_temporary: 9, class_undeliverable: 3}
        resumed_at: "2026-11-25T11:00:00Z"
        resumed_by: 019a8c2e-4f1b-7a01-9c3d-5e7a10000001
        changes: {priority: {from: normal, to: high}}

