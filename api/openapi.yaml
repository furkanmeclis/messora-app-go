    AutomationTriggerType:
      type: string
      enum: [message_received, new_contact, tag_added, message_status, conversation_closed, subscription_request]
      x-enum-varnames: [TriggerMessageReceived, TriggerNewContact, TriggerTagAdded, TriggerMessageStatus, TriggerConversationClosed, TriggerSubscriptionRequest]

    AutomationTrigger:
      type: object
      additionalProperties: false
      description: Options for the trigger type; see docs/AUTOMATIONS.md.
      properties:
        match: { type: string, enum: [any, contains, exact, starts_with] }
