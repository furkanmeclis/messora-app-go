    # ── Inbox (Phase 7) ─────────────────────────────────────────────────────
    ConversationContact:
      type: object
      required: [id, phone, name, profile_name, opted_out, ai_disabled]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        name: { type: string }
        profile_name: { type: string }
        opted_out: { type: boolean }
        ai_disabled: { type: boolean, description: The AI never answers or drafts for this contact. }
    ConversationPhoneNumber:
      type: object
      required: [id, display_phone_number, verified_name, account_id]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid, description: The WhatsApp account the number belongs to (its templates can be sent). }
        display_phone_number: { type: string }
        verified_name: { type: string }
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ConversationLastMessage:
      type: object
      required: [direction, type, body, status]
      properties:
        direction: { type: string, enum: [inbound, outbound] }
        type: { type: string }
        body: { type: string }
        status: { type: string }
    Conversation:
      example:
        id: 019a8c2e-4f1b-7a0e-9c3d-5e7a1000000e
        contact: {id: 019a8c2e-4f1b-7a09-9c3d-5e7a10000009, phone: "+905321234567", name: Ayşe
            Yılmaz, profile_name: Ayşe, opted_out: false, ai_disabled: false}
        phone_number: {id: 019a8c2e-4f1b-7a04-9c3d-5e7a10000004, account_id: 019a8c2e-4f1b-7a0f-9c3d-5e7a1000000f,
          display_phone_number: "+90 212 555 01 23", verified_name: Messora Demo}
        status: open
        assignee: {id: 019a8c2e-4f1b-7a07-9c3d-5e7a10000007, name: Mehmet Kaya}
        unread_count: 2
        last_message_at: "2026-11-25T08:41:00Z"
        last_inbound_at: "2026-11-25T08:41:00Z"
        window_open: true
        window_expires_at: "2026-11-26T08:41:00Z"
        last_message: {direction: inbound, type: text, body: 'Siparişim ne zaman gelir?',
          status: received}
        closed_at: null
        created_at: "2026-11-20T12:00:00Z"
        owner_type: human
        ai_mode: suggest
        ai_status: idle
        ai_status_detail: null
        ai_profile_id: 019a8c2e-4f1b-7a20-9c3d-5e7a10000020
        pending_handoff_id: null
      type: object
      required: [id, contact, phone_number, status, assignee, unread_count, last_message_at, last_inbound_at,
                 window_open, window_expires_at, last_message, closed_at, created_at, owner_type, ai_mode, ai_status,
                 ai_status_detail, ai_profile_id, pending_handoff_id]
      properties:
        id: { type: string, format: uuid }
        contact: { $ref: "#/components/schemas/ConversationContact" }
        phone_number: { $ref: "#/components/schemas/ConversationPhoneNumber" }
        status: { type: string, enum: [open, closed] }
        assignee:
          oneOf:
            - { $ref: "#/components/schemas/UserRef" }
            - { type: "null" }
        unread_count: { type: integer, format: int32 }
        last_message_at: { type: string, format: date-time }
        last_inbound_at: { type: [string, "null"], format: date-time, description: Last customer message that opened the 24-hour window. }
        window_open: { type: boolean, description: Free-form messages can be sent now. }
        window_expires_at: { type: [string, "null"], format: date-time }
        last_message:
          oneOf:
            - { $ref: "#/components/schemas/ConversationLastMessage" }
            - { type: "null" }
        closed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        owner_type: { $ref: "#/components/schemas/ConversationOwnerType" }
        ai_mode: { $ref: "#/components/schemas/ConversationAIMode" }
        ai_status: { type: string, enum: [idle, thinking, error], description: The AI's live state in the conversation. }
        ai_status_detail: { type: [string, "null"], description: "Why the AI stopped (with error), e.g. disabled or rate_limited." }
        ai_profile_id: { type: [string, "null"], format: uuid }
        pending_handoff_id: { type: [string, "null"], format: uuid, description: An escalation nobody took yet (see /handoffs). }
    ConversationResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/Conversation" }, meta: { $ref: "#/components/schemas/Meta" } }
    ConversationListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Conversation" } }
        meta: { $ref: "#/components/schemas/Meta" }
    InboxMedia:
      type: object
      required: [id, mime_type, filename, size_bytes, status]
      properties:
        id: { type: string, format: uuid }
        mime_type: { type: string }
        filename: { type: string }
        size_bytes: { type: [integer, "null"], format: int64 }
        status: { type: string, enum: [pending, stored, failed] }
    InboxMessage:
      example:
        id: 019a8c2e-4f1b-7a11-9c3d-5e7a10000011
        direction: outbound
        type: text
        body: Kargonuz yarın teslim edilecek.
        status: delivered
        failure_class: null
        wamid: wamid.HBgMOTA1MzIxMjM0NTY3FQIAERgSMjU0RkJBQ0E4QjM3QzFGRTlGAA==
        reply_to_wamid: null
        source: api
        sent_by: api_key
        ai_usage_id: null
        error_code: null
        error_title: null
        media: null
        occurred_at: "2026-11-25T08:45:00Z"
        sent_at: "2026-11-25T08:45:01Z"
        delivered_at: "2026-11-25T08:45:03Z"
        read_at: null
        failed_at: null
        created_at: "2026-11-25T08:45:00Z"
      type: object
      required: [id, direction, type, body, status, wamid, reply_to_wamid, source, sent_by, ai_usage_id, error_code, error_title, media,
                 occurred_at, sent_at, delivered_at, read_at, failed_at, created_at]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        type: { type: string }
        body: { type: string }
        status: { type: string, enum: [pending, sending, unknown, sent, delivered, read, failed, received, held, cancelled, deferred, skipped] }
        failure_class: { $ref: "#/components/schemas/FailureClass" }
        wamid: { type: [string, "null"] }
        reply_to_wamid: { type: [string, "null"] }
        source: { type: string, enum: [api, panel, webhook, campaign, automation, ai] }
        sent_by: { type: [string, "null"], enum: [user, api_key, system, ai, null], description: Who wrote an outbound message; ai for AI replies. }
        ai_usage_id: { type: [string, "null"], format: uuid, description: The AI request that wrote the message. }
        error_code: { type: [string, "null"] }
        error_title: { type: [string, "null"] }
        media:
          oneOf:
            - { $ref: "#/components/schemas/InboxMedia" }
            - { type: "null" }
        occurred_at: { type: string, format: date-time }
        sent_at: { type: [string, "null"], format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        read_at: { type: [string, "null"], format: date-time }
        failed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    InboxMessageResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/InboxMessage" }, meta: { $ref: "#/components/schemas/Meta" } }
    InboxMessageListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/InboxMessage" } }
        meta: { $ref: "#/components/schemas/Meta" }
    ReplyRequest:
      example:
        type: text
        text: {body: Kargonuz yarın teslim edilecek.}
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [text, template, image, video, audio, document] }
        reply_to: { type: string, maxLength: 200, description: WhatsApp message ID to quote. }
        text:
          type: object
          additionalProperties: false
          required: [body]
          properties:
            body: { type: string, minLength: 1, maxLength: 4096 }
            preview_url: { type: boolean }
        template:
          type: object
          additionalProperties: false
          required: [name, language]
          properties:
            name: { type: string, maxLength: 512 }
            language: { type: string, maxLength: 15 }
            components:
              type: array
              maxItems: 20
              items: { type: object, additionalProperties: true }
              description: Raw Meta components. Prefer params.
            params:
              $ref: "#/components/schemas/CampaignParams"
              description: >-
                Values for the template's variables, header media and URL
                buttons, in the campaign format; placeholders such as
                {{first_name}} are filled from the conversation's contact.
                Checked against the template before sending.
        media: { $ref: "#/components/schemas/MediaRef" }
    AssignConversationRequest:
      example:
        assignee_id: 019a8c2e-4f1b-7a07-9c3d-5e7a10000007
      type: object
      additionalProperties: false
      required: [assignee_id]
      properties:
        assignee_id: { type: [string, "null"], format: uuid, description: The user to assign; null unassigns. }
    ConversationEvent:
