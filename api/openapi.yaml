    AIProviderKind:
      type: string
      enum: [openai, anthropic, gemini, deepseek, fake]
      description: "`fake` is a scriptable provider available only with AI_FAKE_PROVIDER (development and test)."

    AIProvider:
      type: object
      required: [id, kind, name, key_last4, base_url, status, status_detail, checked_at, models_synced_at, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/AIProviderKind" }
        name: { type: string }
        key_last4: { type: string, description: Last four characters of the key (the key itself is never returned). }
        base_url: { type: [string, "null"], description: Endpoint override (DeepSeek / OpenAI-compatible). }
        status: { type: string, enum: [unknown, ok, invalid, no_balance, error], description: Outcome of the last key check. }
        status_detail: { type: string }
        checked_at: { type: [string, "null"], format: date-time }
        models_synced_at: { type: [string, "null"], format: date-time }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateAIProviderRequest:
      type: object
      additionalProperties: false
      required: [kind, name, api_key]
      properties:
        kind: { $ref: "#/components/schemas/AIProviderKind" }
        name: { type: string, minLength: 1, maxLength: 120 }
        api_key: { type: string, minLength: 8, maxLength: 500, writeOnly: true }
        base_url: { type: string, maxLength: 500 }
        enabled: { type: boolean }

    UpdateAIProviderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        api_key: { type: string, minLength: 8, maxLength: 500, writeOnly: true, description: A new key replaces (rotates) the stored one. }
        base_url: { type: string, maxLength: 500, description: Empty removes the override. }
        enabled: { type: boolean }

    AIProviderResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/AIProvider" }, meta: { $ref: "#/components/schemas/Meta" } }
    AIProviderListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AIProvider" } }
        meta: { $ref: "#/components/schemas/Meta" }

