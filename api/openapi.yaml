        id: 019a8c2e-4f1b-7a10-9c3d-5e7a10000010
        kind: assigned
        actor_type: api_key
        actor_name: null
        assignee: {id: 019a8c2e-4f1b-7a07-9c3d-5e7a10000007, name: Mehmet Kaya}
        created_at: "2026-11-25T08:42:00Z"
      type: object
      required: [id, kind, actor_type, actor_name, assignee, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [assigned, unassigned, closed, reopened, opt_out_requested, opted_out, resubscribed] }
        actor_type: { type: string, enum: [user, api_key, system] }
        actor_name: { type: [string, "null"], description: "The user who acted; null for API keys and automatic reopening." }
        assignee:
          oneOf:
            - { $ref: "#/components/schemas/UserRef" }
            - { type: "null" }
        created_at: { type: string, format: date-time }
    ConversationEventListResponse:
      type: object
