openapi: 3.1.0
info:
  title: Messora API
  version: 0.2.0
  description: |
    REST API of Messora, a self-hosted WhatsApp Business Cloud API platform.

    **Authentication.** Every operation declares its security requirement:

    - `panel` — only callable by the Messora panel (Next.js BFF) over the
      internal network. Used for sign-in flows.
    - `session` — a signed-in panel user. Scopes are the permissions the
      user's role must grant.
    - `apiKey` — `Authorization: Bearer msk_live_…`. Scopes are the scopes the
      key was created with.

    **Envelope.** Success: `{"data": …, "meta": {"request_id": …}}`. Errors:
    `{"error": {"code", "message", "details"}, "meta": {…}}`.

    **Idempotency.** POST operations accept an `Idempotency-Key` header; a
    retried request with the same key and body returns the stored response.
  license:
    name: MIT
servers:
  - url: /api/v1

tags:
  - name: setup
  - name: auth
  - name: me
  - name: users
  - name: roles
  - name: settings
  - name: audit
  - name: api-keys
  - name: system
  - name: channels
  - name: templates
  - name: messages
  - name: conversations
  - name: contacts
  - name: segments
  - name: campaigns
  - name: automations
  - name: webhooks

paths:
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: Whether the first owner account still has to be created
      security: [{ panel: [] }]
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatusResponse" }
        default: { $ref: "#/components/responses/Error" }

  /setup:
    post:
      operationId: completeSetup
      tags: [setup]
      summary: Create the first owner account with the one-time setup token
      security: [{ panel: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteSetupRequest" }
      responses:
        "201":
          description: Owner created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreatedResponse" }
        default: { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with e-mail and password
      security: [{ panel: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in, or a second factor is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        default: { $ref: "#/components/responses/Error" }

  /auth/login/mfa:
    post:
      operationId: loginMfa
      tags: [auth]
      summary: Complete sign-in with a TOTP or recovery code
      security: [{ panel: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginMfaRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreatedResponse" }
        default: { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      security: [{ session: [] }]
      responses:
        "204": { description: "Signed out" }
        default: { $ref: "#/components/responses/Error" }

  /auth/reauth:
    post:
      operationId: reauthenticate
      tags: [auth]
      summary: Confirm identity before a sensitive action
      description: Valid for 10 minutes on the current session.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthRequest" }
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReauthResponse" }
        default: { $ref: "#/components/responses/Error" }

  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: E-mail a password reset link
      description: Always answers 202 so that registered addresses cannot be discovered.
      security: [{ panel: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202": { description: "If the address is registered, an e-mail was sent" }
        default: { $ref: "#/components/responses/Error" }

  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password with a reset token
      security: [{ panel: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: "Password changed; every session was ended" }
        default: { $ref: "#/components/responses/Error" }

  /auth/capabilities:
    get:
      operationId: getAuthCapabilities
      tags: [auth]
      summary: Which optional sign-in features are available
      security: [{ panel: [] }]
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthCapabilitiesResponse" }
        default: { $ref: "#/components/responses/Error" }

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: The signed-in user, role, permissions and session
      security: [{ session: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMe
      tags: [me]
      summary: Update profile
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        default: { $ref: "#/components/responses/Error" }

  /me/password:
    post:
      operationId: changePassword
      tags: [me]
      summary: Change password; ends every other session
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: "Changed" }
        default: { $ref: "#/components/responses/Error" }

  /me/sessions:
    get:
      operationId: listMySessions
      tags: [me]
      summary: Active sessions of the signed-in user
      security: [{ session: [] }]
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionListResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeOtherSessions
      tags: [me]
      summary: End every session except the current one
      security: [{ session: [] }]
      responses:
        "204": { description: "Revoked" }
        default: { $ref: "#/components/responses/Error" }

  /me/sessions/{sessionId}:
    delete:
      operationId: revokeMySession
      tags: [me]
      summary: End one of the user's sessions
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "204": { description: "Revoked" }
        default: { $ref: "#/components/responses/Error" }

  /me/mfa/totp:
    post:
      operationId: startTotpSetup
      tags: [me]
      summary: Generate a TOTP secret to enrol an authenticator app
      description: Requires recent re-authentication.
      security: [{ session: [] }]
      responses:
        "200":
          description: Secret and otpauth URI (not active until confirmed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetupResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: disableTotp
      tags: [me]
      summary: Turn off two-factor authentication
      description: Requires recent re-authentication. Refused when the user's role requires two-factor authentication.
      security: [{ session: [] }]
      responses:
        "204": { description: "Disabled" }
        default: { $ref: "#/components/responses/Error" }

  /me/mfa/totp/confirm:
    post:
      operationId: confirmTotp
      tags: [me]
      summary: Activate TOTP with a code from the app; returns recovery codes once
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpConfirmRequest" }
      responses:
        "200":
          description: Enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodesResponse" }
        default: { $ref: "#/components/responses/Error" }

  /me/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [me]
      summary: Replace all recovery codes
      description: Requires recent re-authentication.
      security: [{ session: [] }]
      responses:
        "200":
          description: New codes (shown once)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodesResponse" }
        default: { $ref: "#/components/responses/Error" }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: All panel users
      security: [{ session: [users.manage] }]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /users/{userId}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Change a user's role or status
      security: [{ session: [users.manage] }]
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        default: { $ref: "#/components/responses/Error" }

  /invitations:
    get:
      operationId: listInvitations
      tags: [users]
      summary: Pending invitations
      security: [{ session: [users.manage] }]
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvitation
      tags: [users]
      summary: Invite someone by e-mail
      description: The response contains the acceptance link once, so it can be shared when e-mail is not configured.
      security: [{ session: [users.manage] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitationRequest" }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreatedResponse" }
        default: { $ref: "#/components/responses/Error" }

  /invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      tags: [users]
      summary: Revoke a pending invitation
      security: [{ session: [users.manage] }]
      parameters:
        - { $ref: "#/components/parameters/InvitationId" }
      responses:
        "204": { description: "Revoked" }
        default: { $ref: "#/components/responses/Error" }

  /invitations/lookup:
    post:
      operationId: lookupInvitation
      tags: [users]
      summary: Show who an invitation token is for
      security: [{ panel: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationTokenRequest" }
      responses:
        "200":
          description: Invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreviewResponse" }
        default: { $ref: "#/components/responses/Error" }

  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [users]
      summary: Accept an invitation and create the account
      security: [{ panel: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInvitationRequest" }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreatedResponse" }
        default: { $ref: "#/components/responses/Error" }

  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: Roles and the permissions they grant
      security: [{ session: [users.manage] }]
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Workspace settings
      security: [{ session: [settings.read] }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Change workspace settings
      security: [{ session: [settings.update] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSettingsRequest" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        default: { $ref: "#/components/responses/Error" }

  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: Audit trail, newest first
      security: [{ session: [audit.read] }]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: entity_type
          in: query
          schema: { type: string, maxLength: 50 }
        - name: entity_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: API keys (secrets are never returned again)
      security: [{ session: [api_keys.manage] }]
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: Create an API key; the secret is shown once
      description: Requires recent re-authentication. Scopes cannot exceed the creator's permissions.
      security: [{ session: [api_keys.manage] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreatedResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api-keys/{apiKeyId}:
    delete:
      operationId: revokeApiKey
      tags: [api-keys]
      summary: Revoke an API key immediately
      security: [{ session: [api_keys.manage] }]
      parameters:
        - { $ref: "#/components/parameters/ApiKeyId" }
      responses:
        "204": { description: "Revoked" }
        default: { $ref: "#/components/responses/Error" }

  /api-keys/whoami:
    get:
      operationId: getApiKeySelf
      tags: [api-keys]
      summary: Describe the API key used for this request
      description: Lets integrations verify their credentials and scopes.
      security: [{ apiKey: [] }]
      responses:
        "200":
          description: The calling key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyResponse" }
        default: { $ref: "#/components/responses/Error" }

  /system/status:
    get:
      operationId: getSystemStatus
      tags: [system]
      summary: Health of every component of the installation
      security: [{ session: [settings.read] }]
      responses:
        "200":
          description: Component status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatusResponse" }
        default: { $ref: "#/components/responses/Error" }

  /channels/accounts:
    get:
      operationId: listWhatsAppAccounts
      tags: [channels]
      summary: Connected WhatsApp Business Accounts (credentials are never returned)
      security: [{ session: [channels.read] }]
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppAccountListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: connectWhatsAppAccount
      tags: [channels]
      summary: Connect a WhatsApp Business Account
      description: The access token is verified against Meta before anything is stored; phone numbers and templates are imported.
      security: [{ session: [channels.manage] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectWhatsAppAccountRequest" }
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppAccountResponse" }
        default: { $ref: "#/components/responses/Error" }

  /channels/accounts/{accountId}:
    patch:
      operationId: updateWhatsAppAccount
      tags: [channels]
      summary: Rename, rotate credentials, or enable/disable an account
      security: [{ session: [channels.manage] }]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWhatsAppAccountRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppAccountResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: disconnectWhatsAppAccount
      tags: [channels]
      summary: Disconnect an account without message history
      security: [{ session: [channels.manage] }]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "204": { description: Disconnected }
        default: { $ref: "#/components/responses/Error" }

  /channels/accounts/{accountId}/sync:
    post:
      operationId: syncWhatsAppAccount
      tags: [channels]
      summary: Refresh phone numbers and templates from Meta
      security: [{ session: [channels.manage] }]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResultResponse" }
        default: { $ref: "#/components/responses/Error" }

  /channels/phone-numbers:
    get:
      operationId: listPhoneNumbers
      tags: [channels]
      summary: Phone numbers of every connected account
      security: [{ session: [channels.read] }, { apiKey: [messages.send] }]
      responses:
        "200":
          description: Numbers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneNumberListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /channels/phone-numbers/{phoneNumberId}/default:
    post:
      operationId: setDefaultPhoneNumber
      tags: [channels]
      summary: Use this number when a request names no sender
      security: [{ session: [channels.manage] }]
      parameters:
        - { $ref: "#/components/parameters/PhoneNumberId" }
      responses:
        "204": { description: Updated }
        default: { $ref: "#/components/responses/Error" }

  /channels/webhook:
    get:
      operationId: getWebhookSetup
      tags: [channels]
      summary: Values to enter in the Meta App dashboard
      security: [{ session: [channels.manage] }]
      responses:
        "200":
          description: Webhook configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSetupResponse" }
        default: { $ref: "#/components/responses/Error" }

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: Message templates mirrored from Meta
      security: [{ session: [templates.read] }, { apiKey: [templates.read] }]
      parameters:
        - name: account_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, maxLength: 40 }
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Submit a template for Meta's review
      security: [{ session: [templates.manage] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTemplateRequest" }
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateResponse" }
        default: { $ref: "#/components/responses/Error" }

  /templates/{templateId}:
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: Delete one language version of a template on Meta and locally
      security: [{ session: [templates.manage] }]
      parameters:
        - { $ref: "#/components/parameters/TemplateId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /messages:
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Queue a WhatsApp message
      description: >-
        The message is stored and sent asynchronously; poll GET /messages/{messageId}
        or use webhooks for the outcome. Outside the 24-hour customer service window
        only approved templates are accepted. Use Idempotency-Key to retry safely.
      security: [{ session: [messages.send] }, { apiKey: [messages.send] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        default: { $ref: "#/components/responses/Error" }

  /messages/{messageId}:
    get:
      operationId: getMessage
      tags: [messages]
      summary: A message and its delivery state
      security: [{ session: [messages.send] }, { apiKey: [messages.send] }]
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
      responses:
        "200":
          description: Message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        default: { $ref: "#/components/responses/Error" }

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: Contacts, newest first
      security: [{ session: [contacts.read] }, { apiKey: [contacts.read] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Name, phone or e-mail contains" }
        - { name: tag_id, in: query, schema: { type: string, format: uuid } }
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - { name: segment_id, in: query, schema: { type: string, format: uuid } }
        - { name: opted_out, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createContact
      tags: [contacts]
      summary: Add a contact
      security: [{ session: [contacts.create] }, { apiKey: [contacts.create] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContactRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        default: { $ref: "#/components/responses/Error" }

  /contacts/{contactId}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: A contact with tags and groups
      security: [{ session: [contacts.read] }, { apiKey: [contacts.read] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Edit a contact; an empty string clears an optional field
      security: [{ session: [contacts.update] }, { apiKey: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContactRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Delete a contact and its message history
      security: [{ session: [contacts.delete] }, { apiKey: [contacts.delete] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /contacts/{contactId}/consent:
    post:
      operationId: recordConsent
      tags: [contacts]
      summary: Record an opt-in or opt-out
      description: Opted-out contacts receive no campaign or automation messages.
      security: [{ session: [contacts.update] }, { apiKey: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentRequest" }
      responses:
        "200":
          description: Contact after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        default: { $ref: "#/components/responses/Error" }

  /contacts/{contactId}/notes:
    get:
      operationId: listContactNotes
      tags: [contacts]
      summary: Internal notes, newest first
      security: [{ session: [contacts.read] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addContactNote
      tags: [contacts]
      summary: Add an internal note
      security: [{ session: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteResponse" }
        default: { $ref: "#/components/responses/Error" }

  /contacts/{contactId}/notes/{noteId}:
    delete:
      operationId: deleteContactNote
      tags: [contacts]
      summary: Delete a note
      security: [{ session: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/ContactId" }
        - { $ref: "#/components/parameters/NoteId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /contact-exports:
    get:
      operationId: exportContacts
      tags: [contacts]
      summary: Download matching contacts as CSV or Excel
      security: [{ session: [contacts.export] }, { apiKey: [contacts.export] }]
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx], default: csv } }
        - { name: opted_out, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: tag_id, in: query, schema: { type: string, format: uuid } }
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - { name: segment_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: CSV (UTF-8 with header row) or Excel workbook
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /contact-imports:
    get:
      operationId: listContactImports
      tags: [contacts]
      summary: Recent imports
      security: [{ session: [contacts.import] }]
      responses:
        "200":
          description: Imports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactImportListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: uploadContactImport
      tags: [contacts]
      summary: Upload a CSV or Excel (.xlsx) file (up to 50 MB) to import
      description: >-
        Send the raw file as the request body. The response lists the detected
        columns and the first rows so a column mapping can be chosen; nothing is
        imported until the import is started.
      security: [{ session: [contacts.import] }]
      x-messora-raw-body: 52428800
      parameters:
        - { name: filename, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactImportResponse" }
        default: { $ref: "#/components/responses/Error" }

  /contact-imports/{importId}:
    get:
      operationId: getContactImport
      tags: [contacts]
      summary: Import progress and results
      security: [{ session: [contacts.import] }]
      parameters:
        - { $ref: "#/components/parameters/ImportId" }
      responses:
        "200":
          description: Import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactImportResponse" }
        default: { $ref: "#/components/responses/Error" }

  /contact-imports/{importId}/start:
    post:
      operationId: startContactImport
      tags: [contacts]
      summary: Choose the column mapping and start importing
      security: [{ session: [contacts.import] }]
      parameters:
        - { $ref: "#/components/parameters/ImportId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartContactImportRequest" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactImportResponse" }
        default: { $ref: "#/components/responses/Error" }

  /contact-imports/{importId}/cancel:
    post:
      operationId: cancelContactImport
      tags: [contacts]
      summary: Stop an import; rows already imported stay
      security: [{ session: [contacts.import] }]
      parameters:
        - { $ref: "#/components/parameters/ImportId" }
      responses:
        "200":
          description: Import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactImportResponse" }
        default: { $ref: "#/components/responses/Error" }

  /contact-imports/{importId}/errors:
    get:
      operationId: getContactImportErrors
      tags: [contacts]
      summary: Rows that could not be imported, with the reason, as CSV
      security: [{ session: [contacts.import] }]
      parameters:
        - { $ref: "#/components/parameters/ImportId" }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /tags:
    get:
      operationId: listTags
      tags: [contacts]
      summary: Tags with contact counts
      security: [{ session: [contacts.read] }, { apiKey: [contacts.read] }]
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createTag
      tags: [contacts]
      summary: Create a tag (returns the existing one for a duplicate name)
      security: [{ session: [contacts.update] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagInput" }
      responses:
        "201":
          description: Tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagResponse" }
        default: { $ref: "#/components/responses/Error" }

  /tags/{tagId}:
    patch:
      operationId: updateTag
      tags: [contacts]
      summary: Rename or recolour a tag
      security: [{ session: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/TagId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagInput" }
      responses:
        "200":
          description: Tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTag
      tags: [contacts]
      summary: Delete a tag from every contact
      security: [{ session: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/TagId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /groups:
    get:
      operationId: listGroups
      tags: [contacts]
      summary: Contact groups with member counts
      security: [{ session: [contacts.read] }, { apiKey: [contacts.read] }]
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createGroup
      tags: [contacts]
      summary: Create a group
      security: [{ session: [contacts.update] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupResponse" }
        default: { $ref: "#/components/responses/Error" }

  /groups/{groupId}:
    patch:
      operationId: updateGroup
      tags: [contacts]
      summary: Rename or describe a group
      security: [{ session: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteGroup
      tags: [contacts]
      summary: Delete a group (contacts stay)
      security: [{ session: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /groups/{groupId}/members:
    post:
      operationId: changeGroupMembers
      tags: [contacts]
      summary: Add or remove contacts
      security: [{ session: [contacts.update] }, { apiKey: [contacts.update] }]
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupMembersRequest" }
      responses:
        "200":
          description: Rows changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountResponse" }
        default: { $ref: "#/components/responses/Error" }

  /segments:
    get:
      operationId: listSegments
      tags: [segments]
      summary: Saved segments
      security: [{ session: [segments.read] }, { apiKey: [segments.read] }]
      responses:
        "200":
          description: Segments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSegment
      tags: [segments]
      summary: Save a segment
      security: [{ session: [segments.manage] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SegmentInput" }
      responses:
        "201":
          description: Segment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentResponse" }
        default: { $ref: "#/components/responses/Error" }

  /segments/preview:
    post:
      operationId: previewSegment
      tags: [segments]
      summary: Count matching contacts and show a sample, without saving
      security: [{ session: [segments.read] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [definition]
              properties:
                definition: { $ref: "#/components/schemas/SegmentDefinition" }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentPreviewResponse" }
        default: { $ref: "#/components/responses/Error" }

  /segments/{segmentId}:
    get:
      operationId: getSegment
      tags: [segments]
      summary: A segment with its current size
      security: [{ session: [segments.read] }, { apiKey: [segments.read] }]
      parameters:
        - { $ref: "#/components/parameters/SegmentId" }
      responses:
        "200":
          description: Segment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentResponse" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSegment
      tags: [segments]
      summary: Edit a segment
      security: [{ session: [segments.manage] }]
      parameters:
        - { $ref: "#/components/parameters/SegmentId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSegmentRequest" }
      responses:
        "200":
          description: Segment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSegment
      tags: [segments]
      summary: Delete a segment
      security: [{ session: [segments.manage] }]
      parameters:
        - { $ref: "#/components/parameters/SegmentId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  # ── Realtime (Phase 6) ────────────────────────────────────────────────────
  /realtime/connection-token:
    post:
      operationId: createRealtimeConnectionToken
      tags: [realtime]
      summary: Token for opening a Centrifugo connection
      description: >-
        A short-lived HS256 JWT for Centrifugo with the user as subject. The
        user's personal channel and system notices are subscribed server-side.
        The client asks for a new token before this one expires.
      security: [{ session: [] }]
      responses:
        "200":
          description: Connection token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealtimeTokenResponse" }
        default: { $ref: "#/components/responses/Error" }

  /realtime/subscription-token:
    post:
      operationId: createRealtimeSubscriptionToken
      tags: [realtime]
      summary: Token for subscribing to one channel
      description: >-
        Issued only when the user may read the channel: `inbox:all` needs
        conversations.read or conversations.read_all, `conversation:<id>`
        needs conversations.read_all, or conversations.read when the
        conversation is assigned to the user or to nobody, `campaign:all` and `campaign:<id>` need
        campaigns.read. Any other channel answers 403 CHANNEL_FORBIDDEN.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealtimeSubscriptionRequest" }
      responses:
        "200":
          description: Subscription token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealtimeTokenResponse" }
        default: { $ref: "#/components/responses/Error" }

  # ── Campaigns (Phase 5) ──────────────────────────────────────────────────
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: Campaigns, newest first
      security: [{ session: [campaigns.read] }, { apiKey: [campaigns.read] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/CampaignStatus" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Campaigns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a draft campaign
      security: [{ session: [campaigns.create] }, { apiKey: [campaigns.create] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCampaignRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: A campaign with live counts
      security: [{ session: [campaigns.read] }, { apiKey: [campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Edit a draft or scheduled campaign
      security: [{ session: [campaigns.create] }, { apiKey: [campaigns.create] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCampaignRequest" }
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign that is not running or paused
      security: [{ session: [campaigns.delete] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/start:
    post:
      operationId: startCampaign
      tags: [campaigns]
      summary: Start now, or schedule with `scheduled_at`
      security: [{ session: [campaigns.start] }, { apiKey: [campaigns.start] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scheduled_at: { type: string, format: date-time }
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/pause:
    post:
      operationId: pauseCampaign
      tags: [campaigns]
      summary: Pause sending; unsent messages are held
      security: [{ session: [campaigns.pause] }, { apiKey: [campaigns.pause] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/resume:
    post:
      operationId: resumeCampaign
      tags: [campaigns]
      summary: Resume a paused campaign
      security: [{ session: [campaigns.start] }, { apiKey: [campaigns.start] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/cancel:
    post:
      operationId: cancelCampaign
      tags: [campaigns]
      summary: Stop for good; unsent messages are cancelled
      security: [{ session: [campaigns.pause] }, { apiKey: [campaigns.pause] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignResponse" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/events:
    get:
      operationId: listCampaignEvents
      tags: [campaigns]
      summary: Lifecycle events (started, paused, resumed, completed …)
      security: [{ session: [campaigns.read] }, { apiKey: [campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignEventListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /campaigns/{campaignId}/recipients:
    get:
      operationId: listCampaignRecipients
      tags: [campaigns]
      summary: Recipients with their message state
      security: [{ session: [campaigns.read] }, { apiKey: [campaigns.read] }]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
        - { name: state, in: query, schema: { type: string, enum: [pending, queued, skipped, cancelled] } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Recipients
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignRecipientListResponse" }
        default: { $ref: "#/components/responses/Error" }

  # ── Inbox (Phase 7) ─────────────────────────────────────────────────────────
  # Visibility: conversations.read_all sees every conversation; with only
  # conversations.read, a caller sees conversations assigned to them or to
  # nobody. Invisible conversations answer 404 on every operation.
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: Conversations visible to the caller, most recent activity first
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
        - { apiKey: [conversations.read] }
        - { apiKey: [conversations.read_all] }
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, closed] } }
        - name: assignee
          in: query
          description: "`me`, `unassigned` or a user ID."
          schema: { type: string, maxLength: 36 }
        - { name: unread, in: query, schema: { type: boolean }, description: Only conversations with unread customer messages. }
        - { name: phone_number_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Contact name or phone contains" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: A conversation with its contact and 24-hour window
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
        - { apiKey: [conversations.read] }
        - { apiKey: [conversations.read_all] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/messages:
    get:
      operationId: listConversationMessages
      tags: [conversations]
      summary: Message history, newest first
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
        - { apiKey: [conversations.read] }
        - { apiKey: [conversations.read_all] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessageListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: replyToConversation
      tags: [conversations]
      summary: Send a message in the conversation
      description: >-
        Queued like POST /messages, from the conversation's number. Free-form
        messages need an open 24-hour window (422 OUTSIDE_SERVICE_WINDOW
        otherwise; send an approved template instead); templates are refused
        to opted-out contacts (422 CONTACT_OPTED_OUT).
      security:
        - { session: [conversations.reply] }
        - { apiKey: [conversations.reply] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplyRequest" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessageResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/assignment:
    put:
      operationId: assignConversation
      tags: [conversations]
      summary: Assign the conversation to a user, or unassign it with null
      security:
        - { session: [conversations.assign] }
        - { apiKey: [conversations.assign] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignConversationRequest" }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/close:
    post:
      operationId: closeConversation
      tags: [conversations]
      summary: Close the conversation; the next customer message reopens it
      security:
        - { session: [conversations.assign] }
        - { apiKey: [conversations.assign] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/reopen:
    post:
      operationId: reopenConversation
      tags: [conversations]
      summary: Reopen a closed conversation
      security:
        - { session: [conversations.assign] }
        - { apiKey: [conversations.assign] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      tags: [conversations]
      summary: Mark the customer's messages as read for the team
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/events:
    get:
      operationId: listConversationEvents
      tags: [conversations]
      summary: Assignment and status history, newest first (last 100)
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
        - { apiKey: [conversations.read] }
        - { apiKey: [conversations.read_all] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationEventListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/media/{mediaId}:
    get:
      operationId: downloadConversationMedia
      tags: [conversations]
      summary: Download a stored media file of a message in the conversation
      description: >-
        Images, video and audio of common types are served inline, everything
        else as an attachment; always with X-Content-Type-Options nosniff and a
        sandboxing Content-Security-Policy. 409 MEDIA_NOT_STORED while the
        worker has not downloaded the file from Meta yet.
      security:
        - { session: [conversations.read] }
        - { session: [conversations.read_all] }
        - { apiKey: [conversations.read] }
        - { apiKey: [conversations.read_all] }
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/MediaId" }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  # ── Automations (Phase 8) ────────────────────────────────────────────────
  /automations:
    get:
      operationId: listAutomations
      tags: [automations]
      summary: Automations with run counts
      security: [{ session: [automations.read] }, { apiKey: [automations.read] }]
      responses:
        "200":
          description: Automations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAutomation
      tags: [automations]
      summary: Create an automation (inactive until enabled)
      security: [{ session: [automations.manage] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAutomationRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationResponse" }
        default: { $ref: "#/components/responses/Error" }

  /automations/{automationId}:
    get:
      operationId: getAutomation
      tags: [automations]
      summary: An automation
      security: [{ session: [automations.read] }, { apiKey: [automations.read] }]
      parameters:
        - { $ref: "#/components/parameters/AutomationId" }
      responses:
        "200":
          description: Automation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationResponse" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAutomation
      tags: [automations]
      summary: Edit or enable/disable an automation
      description: Changing the trigger or steps cancels runs that are still in progress.
      security: [{ session: [automations.manage] }]
      parameters:
        - { $ref: "#/components/parameters/AutomationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAutomationRequest" }
      responses:
        "200":
          description: Automation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAutomation
      tags: [automations]
      summary: Delete an automation and its run history
      security: [{ session: [automations.manage] }]
      parameters:
        - { $ref: "#/components/parameters/AutomationId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /automations/{automationId}/runs:
    get:
      operationId: listAutomationRuns
      tags: [automations]
      summary: Execution log, newest first
      security: [{ session: [automations.read] }]
      parameters:
        - { $ref: "#/components/parameters/AutomationId" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRunListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /automation-runs/{runId}:
    get:
      operationId: getAutomationRun
      tags: [automations]
      summary: A run with every executed step
      security: [{ session: [automations.read] }]
      parameters:
        - { $ref: "#/components/parameters/RunId" }
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRunResponse" }
        default: { $ref: "#/components/responses/Error" }

  # ── Outgoing webhooks (Phase 8) ─────────────────────────────────────────────
  # Receivers integrators register. Payloads, signatures and the retry policy
  # are documented in docs/WEBHOOKS.md.
  /webhook-event-types:
    get:
      operationId: listWebhookEventTypes
      tags: [webhooks]
      summary: Event types an endpoint can subscribe to
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      responses:
        "200":
          description: Event catalogue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEventTypeListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /webhook-endpoints:
    get:
      operationId: listWebhookEndpoints
      tags: [webhooks]
      summary: Registered endpoints, newest first
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      responses:
        "200":
          description: Endpoints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createWebhookEndpoint
      tags: [webhooks]
      summary: Register an endpoint; the signing secret is returned once
      description: >-
        The URL must be https and must resolve to a public address (422
        otherwise). The signing secret is generated by Messora and only shown
        in this response and after rotation.
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookEndpointRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointSecretResponse" }
        default: { $ref: "#/components/responses/Error" }

  /webhook-endpoints/{endpointId}:
    get:
      operationId: getWebhookEndpoint
      tags: [webhooks]
      summary: One endpoint
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/EndpointId" }
      responses:
        "200":
          description: Endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointResponse" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateWebhookEndpoint
      tags: [webhooks]
      summary: Change the URL, description, events or active flag
      description: Re-activating an endpoint clears its `disabled_reason`.
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/EndpointId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWebhookEndpointRequest" }
      responses:
        "200":
          description: Endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWebhookEndpoint
      tags: [webhooks]
      summary: Delete an endpoint and its delivery log
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/EndpointId" }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /webhook-endpoints/{endpointId}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      tags: [webhooks]
      summary: Replace the signing secret; the new one is returned once
      description: The old secret stops working immediately, including for retries of earlier events.
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/EndpointId" }
      responses:
        "200":
          description: Endpoint and its new secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointSecretResponse" }
        default: { $ref: "#/components/responses/Error" }

  /webhook-endpoints/{endpointId}/test:
    post:
      operationId: sendWebhookTest
      tags: [webhooks]
      summary: Queue a `webhook.test` event for this endpoint only
      description: Also works for an inactive endpoint, so a receiver can be checked before it is switched back on.
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/EndpointId" }
      responses:
        "201":
          description: The queued delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryResponse" }
        default: { $ref: "#/components/responses/Error" }

  /webhook-endpoints/{endpointId}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: Delivery log of an endpoint, newest first
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/EndpointId" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/WebhookDeliveryStatus" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryListResponse" }
        default: { $ref: "#/components/responses/Error" }

  /webhook-deliveries/{deliveryId}/redeliver:
    post:
      operationId: redeliverWebhook
      tags: [webhooks]
      summary: Send a delivery again with a fresh retry budget
      description: >-
        The receiver gets the same event (same `Messora-Event-Id`) with a new
        signature. 409 DELIVERY_IN_PROGRESS while a request is in flight.
      security: [{ session: [webhooks.manage] }, { apiKey: [webhooks.manage] }]
      parameters:
        - { $ref: "#/components/parameters/DeliveryId" }
      responses:
        "200":
          description: The re-queued delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryResponse" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    panel:
      type: apiKey
      in: header
      name: X-Messora-BFF
      description: Shared secret of the panel; only present on the internal network.
    session:
      type: http
      scheme: bearer
      description: Opaque panel session token, accepted only together with the panel secret.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: msk_live_…

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhoneNumberId:
      name: phoneNumberId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NoteId:
      name: noteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SegmentId:
      name: segmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AutomationId:
      name: automationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EndpointId:
      name: endpointId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `meta.next_cursor`.
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Retry-safe POST: a repeated request with the same key replays the first
        successful response for 24 hours. Rejected requests (4xx/5xx) are not
        remembered, so a corrected request may reuse the key.
      schema: { type: string, minLength: 8, maxLength: 200 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }
        next_cursor: { type: string }

    ErrorDetail:
      type: object
      required: [code]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }

    ErrorBody:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          examples: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, REAUTH_REQUIRED, INTERNAL_ERROR]
        message: { type: string }
        details:
          type: array
          items: { $ref: "#/components/schemas/ErrorDetail" }

    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }
        meta: { $ref: "#/components/schemas/Meta" }

    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 254

    Password:
      type: string
      minLength: 12
      maxLength: 256
      description: At least 12 characters. Common passwords are rejected.

    PersonName:
      type: string
      minLength: 1
      maxLength: 120

    RoleKey:
      type: string
      enum: [owner, admin, manager, agent]

    Permission:
      type: string
      pattern: '^[a-z_]+\.[a-z_]+$'

    RoleRef:
      type: object
      required: [key, name]
      properties:
        key: { $ref: "#/components/schemas/RoleKey" }
        name: { type: string }

    User:
      type: object
      required: [id, email, name, status, role, mfa_enabled, locale, timezone, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, disabled] }
        role: { $ref: "#/components/schemas/RoleRef" }
        mfa_enabled: { type: boolean }
        locale: { type: string }
        timezone: { type: string }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    SessionInfo:
      type: object
      required: [id, created_at, last_seen_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }

    Me:
      type: object
      required: [user, permissions, session, mfa_required]
      properties:
        user: { $ref: "#/components/schemas/User" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        session:
          type: object
          required: [id, expires_at]
          properties:
            id: { type: string, format: uuid }
            expires_at: { type: string, format: date-time }
            reauth_valid_until: { type: [string, "null"], format: date-time }
        mfa_required:
          type: boolean
          description: The user's role requires two-factor authentication but it is not enabled yet.

    SessionCreated:
      type: object
      required: [session_token, expires_at, user]
      properties:
        session_token:
          type: string
          description: Opaque token. The panel stores it in an HttpOnly cookie; never expose it to browsers.
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    SetupStatus:
      type: object
      required: [setup_required]
      properties:
        setup_required: { type: boolean }

    CompleteSetupRequest:
      type: object
      additionalProperties: false
      required: [token, name, email, password]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
        name: { $ref: "#/components/schemas/PersonName" }
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/Password" }
        organization_name: { type: string, minLength: 1, maxLength: 120 }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
