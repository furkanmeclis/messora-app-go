        account_id: { type: string, format: uuid }
        account_name: { type: string }
        phone_number_id: { type: string }
        display_phone_number: { type: string }
        verified_name: { type: string }
        quality_rating: { type: string }
        messaging_limit: { type: string }
        throughput_level: { type: string }
        is_default: { type: boolean }

    WebhookSetup:
      type: object
      required: [callback_url, verify_token, signature_verification]
      properties:
        callback_url: { type: string }
        verify_token: { type: string }
        signature_verification:
          type: boolean
          description: False until an app secret is configured; webhooks are rejected until then.
        fields:
          type: array
          items: { type: string }

    Template:
      type: object
      required: [id, account_id, name, language, category, status, parameter_format, components, rejected_reason]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        account_name: { type: string }
        meta_template_id: { type: string }
        name: { type: string }
        language: { type: string }
        category: { type: string }
        status: { type: string }
        parameter_format: { type: string }
        components:
          type: array
          items: { type: object, additionalProperties: true }
        rejected_reason: { type: string }
        quality_score: { type: string }
        synced_at: { type: string, format: date-time }

    CreateTemplateRequest:
      type: object
      additionalProperties: false
      required: [account_id, name, language, category, components]
      properties:
        account_id: { type: string, format: uuid }
        name: { type: string, pattern: "^[a-z0-9_]{1,512}$" }
        language: { type: string, minLength: 2, maxLength: 15 }
        category: { type: string, enum: [MARKETING, UTILITY, AUTHENTICATION] }
        parameter_format: { type: string, enum: [POSITIONAL, NAMED] }
        components:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: object, additionalProperties: true }

    MediaRef:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, maxLength: 200 }
        link: { type: string, format: uri, maxLength: 2000 }
        caption: { type: string, maxLength: 1024 }
        filename: { type: string, maxLength: 240 }

    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [to, type]
      properties:
        to: { type: string, minLength: 7, maxLength: 24, description: Recipient phone number in international format. }
        phone_number_id: { type: string, format: uuid, description: Sender; defaults to the default number. }
        type: { type: string, enum: [text, template, image, video, audio, document, sticker, location, reaction, interactive] }
        reply_to: { type: string, maxLength: 200, description: WhatsApp message ID to quote. }
        text:
          type: object
          additionalProperties: false
          required: [body]
          properties:
            body: { type: string, minLength: 1, maxLength: 4096 }
            preview_url: { type: boolean }
        template:
          type: object
          additionalProperties: false
          required: [name, language]
          properties:
            name: { type: string, maxLength: 512 }
            language: { type: string, maxLength: 15 }
            components:
              type: array
              maxItems: 20
              items: { type: object, additionalProperties: true }
        media: { $ref: "#/components/schemas/MediaRef" }
        location:
          type: object
          additionalProperties: false
          required: [latitude, longitude]
          properties:
            latitude: { type: number, format: double, minimum: -90, maximum: 90 }
            longitude: { type: number, format: double, minimum: -180, maximum: 180 }
            name: { type: string, maxLength: 1000 }
            address: { type: string, maxLength: 1000 }
        reaction:
          type: object
          additionalProperties: false
          required: [message_id, emoji]
          properties:
            message_id: { type: string, maxLength: 200 }
            emoji: { type: string, maxLength: 16 }
        interactive:
          type: object
          additionalProperties: true
          description: Meta's interactive object (button, list or cta_url).

    Message:
      type: object
      required: [id, phone_number_id, contact_id, to, direction, type, body, status, created_at]
      properties:
        id: { type: string, format: uuid }
        phone_number_id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        to: { type: string }
        direction: { type: string, enum: [inbound, outbound] }
        wamid: { type: [string, "null"] }
        type: { type: string }
        body: { type: string }
        status: { type: string, enum: [pending, sending, unknown, sent, delivered, read, failed, received] }
        error_code: { type: [string, "null"] }
        error_title: { type: [string, "null"] }
        sent_at: { type: [string, "null"], format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        read_at: { type: [string, "null"], format: date-time }
        failed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    WhatsAppAccountResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/WhatsAppAccount" }, meta: { $ref: "#/components/schemas/Meta" } }
    WhatsAppAccountListResponse:
