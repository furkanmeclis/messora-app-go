      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ConversationEvent" } }
        meta: { $ref: "#/components/schemas/Meta" }

    # ── Conversation intelligence and AI handoff (Phase 16C P6) ────────────
    ConversationOwnerType:
      type: string
      enum: [none, human, ai]
      description: Who answers the conversation.
    ConversationAIMode:
      type: string
      enum: ["off", suggest, auto_reply, awaiting_approval]
      description: >-
        off — no AI; suggest — the AI drafts replies for the agent;
        auto_reply — the AI answers the customer; awaiting_approval — the AI
        writes replies an agent approves before they are sent.
    SetConversationAIModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/ConversationAIMode" }
    HandoffRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: { type: string, enum: [ai, human] }
        mode: { type: string, enum: [auto_reply, awaiting_approval], description: "With `to: ai`; default auto_reply." }
        assignee_id: { type: [string, "null"], format: uuid, description: "With `to: human`: the person, or null for the team's pool." }
        note: { type: string, maxLength: 500, description: Why (kept with the handoff). }
    HandoffReason:
      type: string
      enum: [customer_request, no_answer, low_confidence, critical_intent, unauthorized_action, window_closed, ai_error, manual]
    ConversationHandoff:
      type: object
      required: [id, from_type, from_user, to_type, to_user, reason, reason_detail, summary, summary_source, detected_need,
                 suggested_next_action, collected_fields, created_at, accepted_by, accepted_at]
      properties:
        id: { type: string, format: uuid }
        from_type: { type: string, enum: [ai, human, none] }
        from_user:
          oneOf:
            - { $ref: "#/components/schemas/UserRef" }
            - { type: "null" }
        to_type: { type: string, enum: [ai, human, pool] }
        to_user:
          oneOf:
            - { $ref: "#/components/schemas/UserRef" }
            - { type: "null" }
        reason: { $ref: "#/components/schemas/HandoffReason" }
        reason_detail: { type: string }
        summary: { type: string }
        summary_source: { type: string, enum: [ai, fallback, none], description: "ai — written by the AI; fallback — built from the last messages." }
        detected_need: { type: string }
        suggested_next_action: { type: string }
        collected_fields:
          type: object
          additionalProperties: { type: string }
          description: What the AI collected (not verified).
        created_at: { type: string, format: date-time }
        accepted_by:
          oneOf:
            - { $ref: "#/components/schemas/UserRef" }
            - { type: "null" }
        accepted_at: { type: [string, "null"], format: date-time }
      example:
        id: "0195f0c2-6b1e-7c4a-9d3e-2f1a4b5c6d7e"
        from_type: ai
        from_user: null
        to_type: pool
        to_user: null
        reason: customer_request
        reason_detail: ""
        summary: "Müşteri siparişinin gecikmesinden şikâyetçi ve bir temsilciyle görüşmek istiyor."
        summary_source: ai
        detected_need: "Sipariş #1042'nin teslim tarihi"
        suggested_next_action: "Kargo firmasından durumu sorup müşteriye tarih verin."
        collected_fields: { email: "ayse@example.com" }
        created_at: "2026-11-25T14:32:00Z"
        accepted_by: null
        accepted_at: null
    ConversationHandoffListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ConversationHandoff" } }
        meta: { $ref: "#/components/schemas/Meta" }
    ConversationNote:
      type: object
      required: [id, author_type, author, body, for_ai, created_at]
      properties:
        id: { type: string, format: uuid }
        author_type: { type: string, enum: [user, system, ai] }
        author:
          oneOf:
            - { $ref: "#/components/schemas/UserRef" }
            - { type: "null" }
        body: { type: string }
        for_ai: { type: boolean, description: Given to the AI as an instruction from the team. }
        created_at: { type: string, format: date-time }
      example:
        id: "0195f0c2-6b1e-7c4a-9d3e-2f1a4b5c6d7e"
        author_type: user
        author: { id: "0195f0c2-0000-7000-8000-000000000001", name: "Ayşe" }
        body: "Müşteri VIP; kargo ücretini sorarsa ücretsiz olduğunu söyle."
        for_ai: true
        created_at: "2026-11-25T14:30:00Z"
    CreateConversationNoteRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        for_ai: { type: boolean, default: false }
