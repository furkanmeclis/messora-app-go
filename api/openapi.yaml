        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        definition: { $ref: "#/components/schemas/SegmentDefinition" }

    SegmentPreview:
      type: object
      required: [count, sample]
      properties:
        count: { type: integer, format: int64 }
        sample:
          type: array
          items: { $ref: "#/components/schemas/Contact" }

    ContactImport:
      type: object
      required: [id, filename, status, headers, preview, mapping, duplicate_policy, add_tags, total_rows, processed_rows,
                 created_count, updated_count, skipped_count, failed_count, has_error_report, created_at]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        status: { type: string, enum: [uploaded, queued, running, completed, failed, cancelled] }
        headers:
          type: array
          items: { type: string }
        preview:
          type: array
          items:
            type: array
            items: { type: string }
        mapping:
          type: object
          additionalProperties: { type: string }
        duplicate_policy: { type: string, enum: [skip, update] }
        add_tags:
          type: array
          items: { type: string }
        group_id: { type: [string, "null"], format: uuid }
        total_rows: { type: integer, format: int64 }
        processed_rows: { type: integer, format: int64 }
        created_count: { type: integer, format: int64 }
        updated_count: { type: integer, format: int64 }
        skipped_count: { type: integer, format: int64 }
        failed_count: { type: integer, format: int64 }
        has_error_report: { type: boolean }
        last_error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    StartContactImportRequest:
      type: object
      additionalProperties: false
      required: [mapping]
      properties:
        mapping:
          type: object
          description: Contact field → column header. "phone" is required; other keys are name, email, var1–var5, tags, or "attr:<name>".
          minProperties: 1
          maxProperties: 60
          additionalProperties: { type: string, minLength: 1, maxLength: 200 }
        duplicate_policy: { type: string, enum: [skip, update], default: skip }
        add_tags:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 60 }
        group_id: { type: string, format: uuid }

    ContactResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: "#/components/schemas/Contact" }, meta: { $ref: "#/components/schemas/Meta" } }
    ContactListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Contact" } }
        meta: { $ref: "#/components/schemas/Meta" }
    NoteResponse:
