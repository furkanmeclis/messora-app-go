<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Çevrimdışı</title>
<style>
:root{color-scheme:light dark;font-family:ui-sans-serif,system-ui,sans-serif}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:Canvas;color:CanvasText}
main{max-width:28rem;padding:2rem;text-align:center}
.mark{width:56px;height:56px;margin:0 auto 1rem;border-radius:16px;display:grid;place-items:center;background:#4f46e5;color:#fff;font-size:28px}
h1{font-size:1.25rem;margin:.25rem 0}
p{opacity:.7;line-height:1.5;margin:.25rem 0 1rem}
hr{border:0;border-top:1px solid color-mix(in srgb,CanvasText 15%,transparent);margin:1.5rem 0}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">⌁</div>
<h1>You are offline</h1>
<p>Messora needs a connection to the server. It reconnects as soon as the network is back.</p>
<hr>
<h1 lang="tr">Çevrimdışısınız</h1>
<p lang="tr">Messora sunucuya bağlanmak zorunda. Ağ geri geldiğinde kendiliğinden bağlanır.</p>
<a href="/" style="display:inline-block;text-decoration:none;padding:.5rem 1rem;border-radius:.6rem;background:#4f46e5;color:#fff">Retry · Tekrar dene</a>
</main>
</body>
</html>
