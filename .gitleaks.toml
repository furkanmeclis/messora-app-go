# gitleaks configuration: default rules plus paths that are never committed.
[extend]
useDefault = true

[allowlist]
description = "Local-only directories, generated code and test fixtures"
paths = [
  '''^reference/''',
  '''^frontend/node_modules/''',
  '''^frontend/\.next/''',
  # Local git worktrees of parallel work (never committed).
  '''^\.claude/''',
  # Repository secrets on the maintainer's machine (git-ignored).
  '''^secrets\.env$''',
  # oapi-codegen embeds the gzipped spec as base64; random-looking by design.
  '''^internal/api/api\.gen\.go$''',
]
# Passwords used only by tests (also present in earlier commits, so the
# history scan needs them here, not just inline allow comments).
regexes = [
  '''Correct-horse-staple-91?''',
  '''Horse-battery-staple-42''',
  '''Every-route-renders-27''',
  '''Plenty-of-entropy-58''',
  # Unsigned licence used by the licence-gate tests (in history).
  '''msl1\.forged\.key''',
  # Made-up Meta tokens of the token lifecycle test.
  '''EAAG-[a-z0-9-]+-0123456789''',
  # A made-up webhook secret once used in an OpenAPI example (in history).
  '''whsec_5f0d3c8e2a9b4e17a6c1d0f97e3b7b9a''',
  # Example UUIDs used throughout the OpenAPI examples.
  '''019a8c2e-4f1b-7a10-9c3d-[0-9a-f]{12}''',
  # Made-up AI provider keys of the AI module tests.
  '''sk-test-0123456789abcdef''',
  '''sk-proj-AbCdEf0123456789xyz''',
]
