# Messora — single-command self-hosted stack.
#
#   cp .env.example .env
#   docker compose up -d --build
#
# First start: `messora-init` generates every secret you did not set in .env
# into the `messora-secrets` volume (one file per service, readable only by
# that service), then `messora-migrate` applies the database schema.

name: messora

x-messora-app: &messora-app
  image: messora/messora:${MESSORA_VERSION:-dev}
  pull_policy: never # built once by messora-init below, reused by every backend service
  env_file:
    - path: .env
      required: false
  environment: &messora-env
    MESSORA_SECRETS_FILE: /run/messora-secrets/secrets.env
    PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
    POSTGRES_HOST: postgres
    REDIS_ADDR: redis:6379
    CENTRIFUGO_API_URL: http://centrifugo:8000/api
  volumes:
    - type: volume
      source: messora-secrets
      target: /run/messora-secrets
      read_only: true
      volume:
        subpath: app
    # Downloaded WhatsApp media (inbound files are kept after Meta's expiry).
    - messora-media:/var/lib/messora/media
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  messora-init:
    <<: *messora-app
    pull_policy: build
    build:
      context: .
      args:
        VERSION: ${MESSORA_VERSION:-dev}
    command: ["init"]
    # Runs as root only to chown each secret file to its consumer's UID. It
    # has no network access.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    network_mode: none
    restart: "no"
    environment:
      MESSORA_SECRETS_DIR: /secrets
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
    volumes:
      - messora-secrets:/secrets

  postgres:
    # Limits suit a small single server; override MEM_<SERVICE> in .env or
    # use docker-compose.override.yml for larger installations.
    deploy:
      resources:
        limits:
          memory: "${MEM_POSTGRES:-1g}"
          cpus: "2"
    image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-messora}
      POSTGRES_DB: ${POSTGRES_DB:-messora}
      POSTGRES_PASSWORD_FILE: /run/messora-secrets/password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql
      - type: volume
        source: messora-secrets
        target: /run/messora-secrets
        read_only: true
        volume:
          subpath: postgres
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      messora-init:
        condition: service_completed_successfully
    networks: [internal]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  redis:
    deploy:
      resources:
        limits:
          memory: "${MEM_REDIS:-512m}"
          cpus: "1"
    image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    # Config (password, AOF everysec, noeviction) is generated by messora-init.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - type: volume
        source: messora-secrets
        target: /usr/local/etc/redis
        read_only: true
        volume:
          subpath: redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(sed -n 's/^requirepass //p' /usr/local/etc/redis/redis.conf)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      messora-init:
        condition: service_completed_successfully
    networks: [internal]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  centrifugo:
    deploy:
      resources:
        limits:
          memory: "${MEM_CENTRIFUGO:-256m}"
          cpus: "1"
    image: centrifugo/centrifugo:v6.10.3@sha256:33fdbbce7d195dde316cbde17bc1d2a17b9e345de82799d1ec3c2bb8916e3803
    command: ["centrifugo", "--config", "/etc/centrifugo/config.json"]
    volumes:
      - type: volume
        source: messora-secrets
        target: /etc/centrifugo
        read_only: true
        volume:
          subpath: centrifugo
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      messora-init:
        condition: service_completed_successfully
    networks: [internal, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  messora-migrate:
    <<: *messora-app
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  messora-api:
    deploy:
      resources:
        limits:
          memory: "${MEM_MESSORA_API:-512m}"
          cpus: "2"
    <<: *messora-app
    command: ["api"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/messora", "healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      messora-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    networks: [internal, edge]

  messora-worker:
    deploy:
      resources:
        limits:
          memory: "${MEM_MESSORA_WORKER:-512m}"
          cpus: "2"
    <<: *messora-app
    command: ["worker"]
    stop_grace_period: 45s # > SHUTDOWN_TIMEOUT so in-flight tasks can finish
    healthcheck:
      test: ["CMD", "/usr/local/bin/messora", "healthcheck", "http://127.0.0.1:9100/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      messora-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal, edge] # edge: outbound access to the Meta Graph API

  messora-scheduler:
    deploy:
      resources:
        limits:
          memory: "${MEM_MESSORA_SCHEDULER:-128m}"
          cpus: "0.5"
    <<: *messora-app
    command: ["scheduler"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/messora", "healthcheck", "http://127.0.0.1:9100/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      messora-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]

  messora-web:
    deploy:
      resources:
        limits:
          memory: "${MEM_MESSORA_WEB:-512m}"
          cpus: "1"
    image: messora/messora-web:${MESSORA_VERSION:-dev}
    build:
      context: ./frontend
    # No env_file: the web container only gets what it needs, never database
    # or Meta credentials.
    environment:
      MESSORA_API_INTERNAL_URL: http://messora-api:8080
      MESSORA_SECRETS_FILE: /run/messora-secrets/secrets.env
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
    volumes:
      - type: volume
        source: messora-secrets
        target: /run/messora-secrets
        read_only: true
        volume:
          subpath: web
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=65532,gid=65532
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      messora-api:
        condition: service_healthy
    networks: [internal, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  caddy:
    deploy:
      resources:
        limits:
          memory: "${MEM_CADDY:-128m}"
          cpus: "1"
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deployments/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      messora-web:
        condition: service_healthy
      messora-api:
        condition: service_healthy
    networks: [edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

networks:
  # No internet access: databases are only reachable by Messora services.
  internal:
    internal: true
  edge: {}

volumes:
  postgres-data:
  redis-data:
  messora-secrets:
  messora-media:
  caddy-data:
  caddy-config:
