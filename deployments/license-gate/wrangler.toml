# Messora licence gate. Deploy: npx wrangler@4.162.0 deploy
# The gate key is a secret: messora-license gate-secret (never commit it).
name = "messora-license-gate"
main = "src/gate.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# kid -> base64 Ed25519 public key (messora-license pubkeys).
LICENSE_KEYS = "{}"

[[kv_namespaces]]
binding = "KV"
id = "e801b85f1fad4304a8274d6c6a759b6b"

[[r2_buckets]]
binding = "R2"
bucket_name = "messora-registry"

[observability]
enabled = true
