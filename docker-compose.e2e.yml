# End-to-end test additions (scripts/e2e.sh only, never production):
# Mailpit catches every e-mail the stack sends, so the browser tests can
# read verification and invitation links from its HTTP API on
# 127.0.0.1:${MAILPIT_HTTP_PORT}. Outgoing webhooks may reach a receiver
# the test runs on the host (host.docker.internal: Docker Desktop's
# 192.168.65.0/24, the bridge gateway on Linux); WEBHOOK_ALLOWED_CIDRS is
# the operator allowlist of internal receivers (docs/WEBHOOKS.md).
# E2E only (scripts/e2e.sh adds it): a fake Meta Graph API, so the browser
# tests can drive Embedded Signup (Messora as Tech Provider) without
# Facebook. `messora fake-meta` refuses to run with APP_ENV=production.
services:
  fake-meta:
    image: ${MESSORA_IMAGE:-messora/messora}:${MESSORA_VERSION:-dev}
    pull_policy: never # built by messora-init
    command: ["fake-meta"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      FAKE_META_ADDR: ":8080"
      FAKE_META_APP_ID: "1234"
      FAKE_META_CALLBACK_URL: ${PUBLIC_APP_URL:-http://localhost}/webhooks/meta/tp
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/usr/local/bin/messora", "healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]


  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    # internal: the Messora services reach it; edge: the published port.
    networks: [internal, edge]
    read_only: true
    tmpfs: [/tmp] # its message store
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  messora-api:
    environment: &e2e-env
      META_GRAPH_BASE_URL: http://fake-meta:8080
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      SMTP_FROM: "Messora <no-reply@messora.test>"
      WEBHOOK_ALLOWED_CIDRS: "172.16.0.0/12,192.168.65.0/24"
    extra_hosts: &e2e-host ["host.docker.internal:host-gateway"]
    depends_on:
      mailpit:
        condition: service_started
      fake-meta:
        condition: service_healthy

  messora-worker:
    environment: *e2e-env
    extra_hosts: *e2e-host
    depends_on:
      mailpit:
        condition: service_started
      fake-meta:
        condition: service_healthy
