name: Release

# Publishes signed multi-arch images to GHCR when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# Copy an already published release into the licence registry by hand:
#   gh workflow run release.yml -f version=0.9.0
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Published version to copy into the licence registry (e.g. 0.9.0)
        required: true

permissions:
  contents: read

jobs:
  images:
    name: Publish ${{ matrix.image.name }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      matrix:
        image:
          - { name: messora, context: . }
          - { name: messora-web, context: ./frontend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image.name }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # Copies the release into the private R2 registry behind the licence gate
  # and announces it on the update channel (docs/LICENSING.md). Needs the
  # repository secret CLOUDFLARE_API_TOKEN (R2 + Workers KV edit).
  licensed:
    name: Publish to the licence registry
    needs: images
    if: ${{ !cancelled() && (needs.images.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip without Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; the release was not copied to the licence registry."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 26
      - name: Publish
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSORA_LICENSE_DIR: ${{ runner.temp }}/messora-license-state
          CLOUDFLARE_ACCOUNT_ID: 6bf52c39839fdfa2048a0476e24e817c
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          go build -o "$RUNNER_TEMP/messora-license" ./cmd/messora-license
          "$RUNNER_TEMP/messora-license" cloudflare --account "$CLOUDFLARE_ACCOUNT_ID" \
            --kv e801b85f1fad4304a8274d6c6a759b6b --bucket messora-registry > /dev/null
          case "$VERSION" in v*) ;; *) VERSION="v$VERSION" ;; esac
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $VERSION"; exit 1; }
          "$RUNNER_TEMP/messora-license" publish "$VERSION" --source "ghcr.io/$OWNER" \
            --notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
